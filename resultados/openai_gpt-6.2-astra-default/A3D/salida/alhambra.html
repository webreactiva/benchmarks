<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Alhambra en 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4eb;color:#263f33;font:15px Arial,sans-serif}header,footer,.actions{display:flex;justify-content:space-between;align-items:center}header{padding:18px 5vw;border-bottom:1px solid #cecfc1}.brand{font:bold 23px Georgia}.brand b{background:#254b39;color:#f7edd2;padding:5px 8px;border-radius:16px 16px 3px 3px}small,footer,label{font:10px monospace;text-transform:uppercase;letter-spacing:1.8px}main{padding:35px 5vw}small{color:#945c39}h1,h2{font-family:Georgia;font-weight:400;letter-spacing:-.05em}h1{font-size:clamp(42px,5vw,80px);margin:8px 0 24px}h2{font-size:36px;margin:10px 0}.layout{display:grid;grid-template-columns:minmax(0,2.35fr) minmax(270px,1fr);border:1px solid #bdc4ae;border-radius:14px;overflow:hidden}.map{position:relative;min-height:470px;background:#e4e7d6}canvas{position:absolute;width:100%;height:100%;touch-action:none;cursor:grab}.badge,.controls{position:absolute;left:18px}.badge{top:18px;border-radius:20px;background:#fcfaee;padding:9px 14px;font:11px monospace}.controls{bottom:17px}button{cursor:pointer;color:inherit;border:1px solid #c3c6b8;border-radius:7px;background:#faf8ee;padding:9px 13px}button:hover{background:#e4e9dc}aside{background:#fcfaf3;padding:26px;display:flex;flex-direction:column}p{color:#59665c;line-height:1.5;margin:0 0 20px}nav{margin:auto 0 18px}nav button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #d6d8cb;border-radius:0;background:none;padding:11px 8px}nav button[aria-current=true]{background:#f0e6d7;color:#864e30}nav span{font:11px monospace;margin-right:12px}#next{background:#294e3c;color:white}footer{margin-top:18px;color:#667263;gap:16px}button:disabled{opacity:.35}@media(max-width:750px){.layout{grid-template-columns:1fr}.map{min-height:345px}header{padding:15px 5vw}.brand{font-size:18px}}
</style><header><div class="brand"><b>♜</b> Atlas de Granada</div><label>Andalucía / España</label></header><main><small>Patrimonio · Recorrido interactivo</small><h1>La Alhambra en 3D</h1><div class="layout"><section class="map"><canvas aria-label="Maqueta de la Alhambra. Arrastra para girar"></canvas><div class="badge">● &nbsp; Maqueta interactiva</div><div class="controls"><button id="rot" aria-label="Girar">↻</button> <button id="minus" aria-label="Alejar">−</button> <button id="plus" aria-label="Acercar">+</button></div></section><aside><small id="count"></small><div aria-live="polite"><h2></h2><p></p></div><nav aria-label="Paradas"></nav><div class="actions"><button id="prev" aria-label="Anterior">←</button><button id="next"></button></div></aside></div><footer><span>Granada · Colina de la Sabika</span><span>Representación esquemática</span></footer></main><script>
const stops=[['Alcazaba','La ruta comienza entre las torres que dominan el extremo occidental de la colina.',-7,0],['Palacio de Carlos V','Un patio circular ocupa el centro de este palacio renacentista de planta cuadrada.',-2,1],['Palacios Nazaríes','Albercas y patios articulan las salas de la antigua residencia de los sultanes nazaríes.',0,-2.5],['El Partal','El pórtico y la Torre de las Damas se reflejan en el agua de la alberca.',4,-1],['Generalife','El recorrido termina en los jardines y huertas de la residencia de descanso de los sultanes.',8,-5]];
const $=s=>document.querySelector(s),cv=$('canvas'),g=cv.getContext('2d'),faces=[];let a=.32,zoom=1,sel=0,pins=[],drag;
function face(p,c){faces.push({p,c})}
const stone=['#bc8963','#d1a47c','#e9caa5'],land=['#aaa07c','#bbad87','#abb889'],tile=['#9b6148','#af7554','#c68b64'];
function box(x,y,w,d,z,h,col=stone){let b=[[x,y,z],[x+w,y,z],[x+w,y+d,z],[x,y+d,z]],t=b.map(([X,Y])=>[X,Y,z+h]);for(let i=0;i<4;i++){let j=(i+1)%4;face([b[i],b[j],t[j],t[i]],col[i%2])}face(t,col[2])}
function tower(x,y,h){box(x,y,.8,.8,.1,h);for(let i of [0,.32,.64])for(let j of [0,.64])box(x+i,y+j,.16,.16,h+.1,.17)}
function house(x,y,w,d){box(x,y,w,d,.1,.85);box(x-.05,y-.05,w+.1,d+.1,.95,.17,tile)}
function tree(x,y,h){for(let i=0;i<6;i++){let t=i*Math.PI/3,u=t+Math.PI/3;face([[x+.2*Math.cos(t),y+.2*Math.sin(t),.1],[x+.2*Math.cos(u),y+.2*Math.sin(u),.1],[x,y,h]],['#53734e','#436348','#68825c'][i%3])}}
let seed=42;function rand(){seed=seed*16807%2147483647;return seed/2147483647}
for(let x=-9;x<10;x++){let d=3.8+Math.sin(x*.4)*.6;box(x,-d,1,d+3,-.75,.85,land);for(let i=0;i<5;i++)tree(x+rand(),2.1+rand()*.85,.8+rand()*.7)}
box(6,-7,4,4,-.75,.85,land);for(let x=-8;x<6;x++){box(x,1.7,1,.24,.1,.72);if(x%2===0)tower(x,1.55,1.15)}
box(-8,-1.7,3,.35,.1,1);box(-8,-1.7,.32,3.4,.1,1);box(-5,-1.7,.32,3.4,.1,1);tower(-8,-1.7,2.2);tower(-8,1.2,2.4);tower(-5,-1.7,1.65);
for(let i=0;i<32;i++){let t=i*Math.PI/16,u=t+Math.PI/16;function pt(v,inner,z){let r=inner?.65:1.13/Math.max(Math.abs(Math.cos(v)),Math.abs(Math.sin(v)));return [-2+r*Math.cos(v),.15+r*Math.sin(v),z]}for(let inner of [true,false])face([pt(t,inner,.1),pt(u,inner,.1),pt(u,inner,1.15),pt(t,inner,1.15)],stone[inner?0:1]);face([pt(t,false,1.15),pt(u,false,1.15),pt(u,true,1.15),pt(t,true,1.15)],stone[2])}
for(let [x,y] of [[-2,-3.4],[.2,-3],[3,-2.4],[7,-6.4]]){house(x,y,1.95,.55);house(x,y+.55,.45,1.35);box(x+.6,y+.8,1.15,.66,.1,.03,['#789b8f','#789b8f','#80ada3'])}tower(.3,-3.35,1.85);tower(4.55,-2.4,1.55);house(8.8,-6,.55,2.65);
for(let i=0;i<85;i++)tree(5.5+rand()*4.2,-3.3+rand()*5,.7+rand()*.8);for(let i=0;i<18;i++)tree(6.15+(i%2)*.55,-6.6+Math.floor(i/2)*.4,1.1);
function draw(){let W=cv.clientWidth,H=cv.clientHeight,D=devicePixelRatio||1;cv.width=W*D;cv.height=H*D;g.scale(D,D);let c=Math.cos(a),s=Math.sin(a),k=Math.min(W/23,H/14)*zoom;function project([x,y,z]){y+=1.35;return [W/2+(x*c-y*s)*k,H*.55+((x*s+y*c)*.57-z*.82)*k]}function path(p){g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y))}
g.strokeStyle='#cbd1bd';g.lineWidth=.65;for(let i=-35;i<35;i++)for(let p of [[[i,-35,0],[i,35,0]],[[-35,i,0],[35,i,0]]]){path(p.map(project));g.stroke()}
function depth(f){return f.p.reduce((v,[x,y,z])=>v+x*s+y*c+z*.69,0)/f.p.length}
for(let f of faces.slice().sort((l,r)=>depth(l)-depth(r))){path(f.p.map(project));g.closePath();g.fillStyle=f.c;g.fill()}
pins=stops.map(q=>project([q[2],q[3],2.6]));path(pins);g.strokeStyle='#986748';g.lineWidth=2;g.setLineDash([3,5]);g.stroke();g.setLineDash([]);pins.forEach(([x,y],i)=>{g.beginPath();g.arc(x,y,sel===i?15:12,0,7);g.fillStyle=sel===i?'#975c3a':'#345440';g.fill();g.strokeStyle='#fff6dc';g.stroke();g.fillStyle='white';g.font='bold 12px monospace';g.textAlign='center';g.fillText(i+1,x,y+4)})}
function select(i){sel=i;$('#count').textContent='Parada 0'+(i+1)+' / 05';$('h2').textContent=stops[i][0];$('p').textContent=stops[i][1];$('#prev').disabled=!i;$('#next').textContent=i===4?'Volver al inicio ↺':'Siguiente parada →';document.querySelectorAll('nav button').forEach((b,k)=>b.setAttribute('aria-current',k===i));draw()}
stops.forEach((q,i)=>{let b=document.createElement('button');b.innerHTML='<span>0'+(i+1)+'</span>'+q[0];b.onclick=()=>select(i);$('nav').append(b)});$('#next').onclick=()=>select((sel+1)%5);$('#prev').onclick=()=>select(sel-1);$('#rot').onclick=()=>{a+=.4;draw()};for(let [id,n] of [['#plus',.15],['#minus',-.15]])$(id).onclick=()=>{zoom=Math.min(1.8,Math.max(.65,zoom+n));draw()};cv.onpointerdown=e=>{drag=[e.clientX,a];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(drag){a=drag[1]+(e.clientX-drag[0])*.008;draw()}};cv.onpointerup=e=>{if(drag&&Math.abs(e.clientX-drag[0])<5){let r=cv.getBoundingClientRect(),i=pins.findIndex(([x,y])=>Math.hypot(e.clientX-r.left-x,e.clientY-r.top-y)<17);if(i>=0)select(i)}drag=null};cv.onpointercancel=()=>drag=null;new ResizeObserver(draw).observe(cv);select(0);
</script></html>
