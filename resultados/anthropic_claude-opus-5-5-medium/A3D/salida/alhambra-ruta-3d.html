<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alhambra 3D · Ruta por la colina roja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#e8c486; --gold-2:#c99a52; --ink:#1a120d;
    --glass:rgba(22,14,10,.66); --line:rgba(232,196,134,.28);
    --text:#f6ecda; --muted:#cbb99c;
    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#140d09;color:var(--text);font-family:var(--sans)}
  #app{position:fixed;inset:0}
  #app canvas{display:block;width:100%;height:100%;outline:none}
  button{font:inherit;color:inherit;cursor:pointer}
  .glass{background:var(--glass);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}

  /* Cabecera */
  #title{position:fixed;top:18px;left:20px;padding:12px 18px 12px 16px;display:flex;gap:12px;align-items:center;pointer-events:none}
  #title svg{width:38px;height:38px;flex:none}
  #title h1{margin:0;font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.02em;line-height:1}
  #title p{margin:3px 0 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}

  /* Lista de paradas */
  #stops{position:fixed;top:96px;left:20px;width:250px;padding:10px 8px;max-height:calc(100% - 420px);overflow:auto}
  #stops ol{list-style:none;margin:0;padding:0}
  #stops li button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--muted);transition:background .2s,color .2s}
  #stops li button:hover{background:rgba(232,196,134,.10);color:var(--text)}
  #stops li button .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600}
  #stops li.done button .n{background:rgba(232,196,134,.18)}
  #stops li.active button{color:var(--text);background:rgba(232,196,134,.14)}
  #stops li.active button .n{background:var(--gold);color:var(--ink);border-color:var(--gold)}

  /* Ficha */
  #card{position:fixed;left:20px;bottom:96px;width:min(410px,calc(100% - 40px));padding:20px 22px 18px;transition:opacity .5s,transform .5s}
  #card.hidden{opacity:0;transform:translateY(14px);pointer-events:none}
  #card .top{display:flex;align-items:baseline;gap:12px}
  #card .num{font-family:var(--serif);font-size:40px;line-height:.8;color:var(--gold)}
  #card h2{margin:0;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.05}
  #card .sub{margin:6px 0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  #card p{margin:0 0 10px;font-size:14px;line-height:1.55;color:#eadcc4}
  #card .fact{margin:12px 0 0;padding:10px 12px;border-left:2px solid var(--gold);background:rgba(232,196,134,.08);border-radius:0 8px 8px 0;font-size:13px;line-height:1.5;color:var(--muted)}
  #card .fact b{color:var(--gold);font-weight:600}
  #card .bar{height:2px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:14px;overflow:hidden}
  #card .bar i{display:block;height:100%;width:0;background:var(--gold)}

  #enroute{position:fixed;top:22px;left:50%;transform:translateX(-50%);padding:9px 18px;font-size:13px;white-space:nowrap;transition:opacity .4s}
  #enroute.hidden{opacity:0}
  #enroute b{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--gold);margin-left:6px}

  /* Controles */
  #controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:8px 10px}
  #controls button{background:none;border:1px solid transparent;border-radius:10px;height:40px;min-width:40px;padding:0 12px;display:grid;place-items:center;font-size:13px;transition:background .2s,border-color .2s}
  #controls button:hover{background:rgba(232,196,134,.12)}
  #controls button.on{border-color:var(--gold);color:var(--gold)}
  #controls #play{background:var(--gold);color:var(--ink);min-width:48px}
  #controls #play:hover{background:#f3d49d}
  #controls svg{width:18px;height:18px;fill:currentColor}
  #controls .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
  #controls label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:0 6px}
  #controls input[type=range]{width:90px;accent-color:var(--gold)}
  #controls #spdv{min-width:30px;color:var(--text)}

  #progress{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.25)}
  #progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold))}

  /* Minimapa */
  #mapbox{position:fixed;right:20px;bottom:20px;padding:10px}
  #mapbox canvas{display:block;width:240px;height:196px;border-radius:8px}
  #mapbox .cap{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 2px 7px}

  #hint{position:fixed;right:20px;top:20px;padding:9px 14px;font-size:12px;color:var(--muted);max-width:270px;line-height:1.45}
  #hint kbd{font-family:var(--sans);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--text)}

  /* Etiquetas 3D */
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-family:var(--serif);font-size:15px;font-weight:600;color:#fff8ea;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.5);white-space:nowrap;padding-bottom:16px;will-change:transform,opacity}
  .lbl::after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:13px;background:linear-gradient(rgba(255,240,210,.9),rgba(255,240,210,0))}

  #fade{position:fixed;inset:0;background:#140d09;opacity:0;pointer-events:none;transition:opacity .35s}
  #fade.on{opacity:1}

  #loader{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a2216,#140d09 70%);z-index:10;transition:opacity .9s}
  #loader.gone{opacity:0;pointer-events:none}
  #loader .in{text-align:center;padding:0 24px}
  #loader svg{width:84px;height:84px;animation:spin 14s linear infinite}
  #loader h2{font-family:var(--serif);font-size:34px;font-weight:600;margin:18px 0 6px}
  #loader .ar{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:18px}
  #loader .msg{margin-top:18px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:860px){
    #stops,#hint{display:none}
    #mapbox{bottom:auto;top:84px;right:12px;padding:6px}
    #mapbox canvas{width:150px;height:122px}
    #mapbox .cap{display:none}
    #card{left:12px;bottom:84px;width:calc(100% - 24px);padding:14px 16px;max-height:42vh;overflow:auto}
    #card h2{font-size:23px}
    #card .num{font-size:32px}
    #card p{font-size:13px}
    #title{top:12px;left:12px;padding:9px 12px}
    #title h1{font-size:21px}
    #enroute{top:auto;bottom:84px}
    #controls{bottom:12px;gap:2px;padding:6px;max-width:calc(100% - 24px)}
    #controls label span.t{display:none}
    #controls input[type=range]{width:64px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<header id="title" class="glass">
  <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#e8c486" stroke-width="1.4"><rect x="8" y="8" width="24" height="24"/><rect x="8" y="8" width="24" height="24" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="5"/></g></svg>
  <div><h1>La Alhambra</h1><p>Ruta 3D · Granada</p></div>
</header>

<nav id="stops" class="glass" aria-label="Paradas de la ruta"><ol></ol></nav>

<section id="card" class="glass hidden" aria-live="polite">
  <div class="top"><div class="num">01</div><h2></h2></div>
  <div class="sub"></div>
  <p class="txt"></p>
  <div class="fact"></div>
  <div class="bar"><i></i></div>
</section>

<div id="enroute" class="glass hidden">En ruta hacia<b></b></div>

<div id="controls" class="glass">
  <button id="prev" title="Parada anterior (←)"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
  <button id="play" title="Reproducir / pausa (espacio)"><svg viewBox="0 0 24 24" id="playicon"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
  <button id="next" title="Siguiente parada (→)"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  <span class="sep"></span>
  <label><span class="t">Velocidad</span><input id="speed" type="range" min="0.5" max="3" step="0.25" value="1"><span id="spdv">1×</span></label>
  <span class="sep"></span>
  <button id="free" title="Vista libre (F)">Vista libre</button>
</div>

<div id="mapbox" class="glass"><div class="cap"><span>Plano</span><span>N ↑</span></div><canvas id="map"></canvas></div>
<div id="hint" class="glass"><kbd>Espacio</kbd> pausa · <kbd>←</kbd><kbd>→</kbd> paradas · <kbd>F</kbd> vista libre<br>En vista libre: arrastra para girar, rueda para acercar.</div>
<div id="progress"><i></i></div>
<div id="fade"></div>

<div id="loader">
  <div class="in">
    <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#e8c486" stroke-width="1"><rect x="8" y="8" width="24" height="24"/><rect x="8" y="8" width="24" height="24" transform="rotate(45 20 20)"/><rect x="11" y="11" width="18" height="18" transform="rotate(22.5 20 20)"/><circle cx="20" cy="20" r="4"/></g></svg>
    <h2>La Alhambra</h2>
    <div class="ar">«Wa lā gālib illā Allāh» — No hay vencedor sino Dios</div>
    <div class="msg" id="loadmsg">Levantando la colina roja…</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) {
  document.getElementById('loadmsg').textContent = 'No se pudo cargar Three.js: hace falta conexión a Internet.';
  return;
}

/* =========================================================
   Utilidades: ruido, aleatorio con semilla, relieve
   ========================================================= */
const PI = Math.PI;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
let seed = 1492;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z) { let s = 0, a = .5, f = 1; for (let i = 0; i < 5; i++) { s += a * vnoise(x * f, z * f); f *= 2.03; a *= .5; } return s; }

/* Ejes: +x = este, -z = norte. La colina de la Sabika es una elipse alargada E-O.
   Altura 0 = meseta de la Alhambra; 12 = Generalife; ~26 = Albaicín; valles a -48. */
const eAlh = (x, z) => Math.hypot(x / 185, z / 62);
const eGen = (x, z) => Math.hypot((x - 262) / 72, (z - 12) / 58);
const eAlb = (x, z) => Math.hypot((x + 40) / 320, (z + 330) / 150);
function H(x, z) {
  const n = fbm(x * .008 + 10, z * .008 + 3);
  let h = -48 + n * 8;
  h = Math.max(h, -46 * ss(1.0, 1.75, eAlh(x, z)));
  h = Math.max(h, 12 - 60 * ss(1.0, 1.8, eGen(x, z)));
  h = Math.max(h, 26 - 74 * ss(.45, 1.5, eAlb(x, z)) + (n - .5) * 10 * ss(.3, .7, eAlb(x, z)));
  h = Math.max(h, -48 + 150 * ss(90, 560, z) + (n - .5) * 50 * ss(70, 260, z));
  const sier = -48 + ss(480, 1100, z) * (260 + 300 * fbm(x * .0024 + 5, z * .0024 + 1));
  h = Math.max(h, sier);
  return h;
}

/* =========================================================
   Render, escena, cielo, luz
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // el sol no se mueve: sombras calculadas una vez
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .3, 9500);
const SUN = V3(-.70, .62, .36).normalize();   // tarde dorada, sol al oeste-suroeste

const skyMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: SUN } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vDir; uniform vec3 sunDir;
    void main(){
      vec3 d = normalize(vDir); float h = d.y;
      vec3 zen = vec3(.22,.40,.68), hor = vec3(.97,.78,.58), low = vec3(.86,.72,.60);
      vec3 c = mix(hor, zen, pow(clamp(h,0.,1.), .45));
      if (h < 0.) c = mix(hor, low, clamp(-h*4., 0., 1.));
      float s = max(dot(d, sunDir), 0.);
      c += vec3(1.,.58,.28)*pow(s,5.)*.30 + vec3(1.,.78,.5)*pow(s,60.)*.45 + vec3(1.,.97,.9)*smoothstep(.9994,.9997,s);
      gl_FragColor = vec4(c, 1.);
    }`,
  side: THREE.BackSide, depthWrite: false
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(8800, 32, 16), skyMat);
sky.renderOrder = -1;
scene.add(sky);
scene.fog = new THREE.Fog(0xf3c697, 650, 5200);

scene.add(new THREE.HemisphereLight(0xd6e4ff, 0x8a6440, .62));
const sun = new THREE.DirectionalLight(0xffd3a2, 2.05);
const SUN_T = V3(70, 0, 0);
sun.position.copy(SUN).multiplyScalar(650).add(SUN_T);
sun.target.position.copy(SUN_T);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -210, right: 210, top: 210, bottom: -210, near: 100, far: 1400 });
sun.shadow.bias = -.0004; sun.shadow.normalBias = .35;
scene.add(sun, sun.target);

/* =========================================================
   Materiales y geometrías base
   ========================================================= */
const M = (hex, rough = .85, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: new THREE.Color(hex).convertSRGBToLinear(), roughness: rough, metalness: 0, envMapIntensity: .7 }, extra));
const mats = {
  wall: M(0xc27a4c),       // tapial rojizo: «al-Qal'a al-Hamra»
  wallDark: M(0xa8623a),
  stucco: M(0xecdfc4, .8),
  marble: M(0xf5f0e6, .35),
  stone: M(0xd9c49c, .8),  // arenisca del Palacio de Carlos V
  roof: M(0x9e5532, .75),
  roofD: M(0x9e5532, .75, { side: THREE.DoubleSide }),
  dark: M(0x2a1d16, .9),
  hedge: M(0x2f5a2b),
  bed: M(0x3f6430),
  cypress: M(0x203d26),
  tree1: M(0x4d6b2d), tree2: M(0x6a7f33), olive: M(0x8a9467),
  house: M(0xf2ede3, .9),
  path: M(0xcdb487, .95),
  water: M(0x3d7d96, .12, { metalness: .15 }),
  f1: M(0xd2465a), f2: M(0xf0cf5a), f3: M(0xe991b5),
  bell: M(0x8a6a3a, .4, { metalness: .8 })
};
const gBox = new THREE.BoxGeometry(1, 1, 1).translate(0, .5, 0);
const gCyl = new THREE.CylinderGeometry(.5, .5, 1, 10).translate(0, .5, 0);
const gCyl12 = new THREE.CylinderGeometry(.5, .5, 1, 12).translate(0, .5, 0);
const gCone4 = new THREE.ConeGeometry(Math.SQRT1_2, 1, 4, 1).rotateY(PI / 4).translate(0, .5, 0);
const gCone8 = new THREE.ConeGeometry(.5, 1, 8, 1).translate(0, .5, 0);
const gSph = new THREE.SphereGeometry(.5, 9, 7).translate(0, .5, 0);
const gIco = new THREE.IcosahedronGeometry(.5, 1).translate(0, .5, 0);

/* Instanciado automático: todo objeto repetido (cajas, columnas, árboles…) se agrupa por geometría+material */
const batches = new Map();
function inst(geo, mat, x, y, z, sx, sy, sz, ry = 0, shadow = true) {
  const key = geo.uuid + mat.uuid + shadow;
  let b = batches.get(key);
  if (!b) { b = { geo, mat, shadow, list: [] }; batches.set(key, b); }
  b.list.push(x, y, z, sx, sy, sz, ry);
}
function flushInstances() {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = V3(), s = V3();
  for (const b of batches.values()) {
    const n = b.list.length / 7;
    const im = new THREE.InstancedMesh(b.geo, b.mat, n);
    for (let i = 0; i < n; i++) {
      const L = b.list, k = i * 7;
      p.set(L[k], L[k + 1], L[k + 2]); s.set(L[k + 3], L[k + 4], L[k + 5]);
      q.setFromEuler(e.set(0, L[k + 6], 0)); m.compose(p, q, s); im.setMatrixAt(i, m);
    }
    im.castShadow = b.shadow; im.receiveShadow = true; im.frustumCulled = false;
    scene.add(im);
  }
}
const jets = [];
function addJet(o, t, h, n) { jets.push({ o, t, h, n, ph: Math.random() }); }
const box = (w, h, d, mat, x, y, z, ry = 0, sh = true) => inst(gBox, mat, x, y, z, w, h, d, ry, sh);
const rot = (cx, cz, ry, lx, lz) => { const c = Math.cos(ry), s = Math.sin(ry); return [cx + lx * c + lz * s, cz - lx * s + lz * c]; };
function addMesh(geo, mat, x, y, z, ry = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}

/* Cubierta a cuatro aguas (con cumbrera en el lado largo) */
function hipRoofGeo(w, d, h) {
  const hw = w / 2, hd = d / 2;
  const A = [-hw, 0, -hd], B = [hw, 0, -hd], C = [hw, 0, hd], D = [-hw, 0, hd];
  let R1, R2, tris;
  if (w >= d) { const r = hw - hd; R1 = [-r, h, 0]; R2 = [r, h, 0]; tris = [A, R2, B, A, R1, R2, D, C, R2, D, R2, R1, A, D, R1, B, R2, C]; }
  else { const r = hd - hw; R1 = [0, h, -r]; R2 = [0, h, r]; tris = [A, R1, B, D, C, R2, A, D, R2, A, R2, R1, B, R1, R2, B, R2, C]; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3));
  g.computeVertexNormals();
  return g;
}
function building(cx, cz, w, d, h, mat, roofH = 0, ry = 0, base = H(cx, cz)) {
  box(w, h + 4, d, mat, cx, base - 4, cz, ry);
  if (roofH) addMesh(hipRoofGeo(w + 1, d + 1, roofH), mats.roofD, cx, base + h, cz, ry);
}
function merlonsRect(cx, cz, w, d, y, mat, ry = 0) {
  const step = 2.3;
  for (const sgn of [-1, 1]) {
    for (let lx = -w / 2 + .6; lx <= w / 2 - .5; lx += step) { const [x, z] = rot(cx, cz, ry, lx, sgn * (d / 2 - .45)); box(1.15, 1.5, .9, mat, x, y, z, ry); }

(function terrain() {
  const geo = new THREE.PlaneGeometry(3600, 3600, 360, 360);
  geo.rotateX(-PI / 2); geo.translate(0, 0, 420);
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);

        cRock = lc(0x8c7a68), cSnow = lc(0xf4f2f0), cGarden = lc(0x5d7432);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = H(x, z);

    const n = fbm(x * .02, z * .02);
    c.copy(cDry).lerp(cGrass, ss(.35, .65, n));
    if (eAlh(x, z) < 1.75 || eGen(x, z) < 1.8) c.lerp(cForest, ss(.15, .5, sl) * .9);
    if (eAlh(x, z) < 1.02 || eGen(x, z) < 1.02) c.copy(cEarth).lerp(cGarden, ss(.4, .62, n));
    if (h > 60) c.lerp(cRock, ss(60, 200, h) * .8);
    c.lerp(cRock, ss(.9, 1.6, sl) * .6);
    c.lerp(cSnow, ss(270, 330, h + (n - .5) * 80));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const t = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .97, envMapIntensity: .5 }));
  t.receiveShadow = true;
  scene.add(t);
})();

let jetPoints, jetPos;
function buildJets() {
  const total = jets.reduce((s, j) => s + j.n, 0);

  const dc = document.createElement('canvas'); dc.width = dc.height = 32;
  const dx = dc.getContext('2d'), gr = dx.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.5, 'rgba(235,246,255,.7)'); gr.addColorStop(1, 'rgba(235,246,255,0)');

}
function updateJets(t) {
  let k = 0;
  for (const j of jets) for (let i = 0; i < j.n; i++) {
    const s = (t * .9 + i / j.n + j.ph) % 1;
    jetPos[k++] = j.o.x + (j.t.x - j.o.x) * s;
    jetPos[k++] = j.o.y + (j.t.y - j.o.y) * s + j.h * 4 * s * (1 - s);
    jetPos[k++] = j.o.z + (j.t.z - j.o.z) * s;
  }
  jetPoints.geometry.attributes.position.needsUpdate = true;
}

  rect(-40, 30, 44, 44, '#d9c49c'); rect(-40, -17, 24, 34, '#ecdfc4'); rect(-4, -10, 28, 16, '#ecdfc4'); rect(-40, -46, 16, 16, '#c27a4c');
  rect(-163, 2, 13, 13, '#c27a4c'); rect(30, -36, 17, 22, '#ecdfc4'); rect(260, 10, 58, 16, '#ecdfc4');
  const lab = (t, x, z) => { const [a, b] = mp(x, z); c.fillStyle = 'rgba(246,236,218,.75)'; c.fillText(t, a, b); };
  lab('ALBAICÍN', -60, -330); lab('DARRO', -40, -120); lab('GENERALIFE', 262, 52);
  // ruta
  c.setLineDash([3 * W / 240, 3 * W / 240]); c.strokeStyle = 'rgba(232,196,134,.9)'; c.lineWidth = 1.4 * W / 240; c.beginPath();
  for (let i = 0; i <= 300; i++) { const p = posCurve.getPoint(i / 300), [a, b] = mp(p.x, p.z); i ? c.lineTo(a, b) : c.moveTo(a, b); }
  c.stroke(); c.setLineDash([]);
  stopU.forEach((su, i) => {
    const p = posCurve.getPoint(su), [a, b] = mp(p.x, p.z);
    c.beginPath(); c.arc(a, b, 6.5 * W / 240, 0, PI * 2); c.fillStyle = '#1a120d'; c.fill(); c.strokeStyle = '#e8c486'; c.lineWidth = 1.2 * W / 240; c.stroke();
    c.fillStyle = '#e8c486'; c.font = `600 ${8 * W / 240}px Inter,system-ui,sans-serif`; c.textBaseline = 'middle'; c.fillText(i + 1, a, b + .5);
  });
}
const camDir = V3();
function drawMap() {
  if (!mapBg) return;
  const W = mapC.width;
  mctx.drawImage(mapBg, 0, 0);
  const [x, y] = mp(camera.position.x, camera.position.z);
  camera.getWorldDirection(camDir);
  const a = Math.atan2(camDir.z, camDir.x);
  mctx.save(); mctx.translate(x, y); mctx.rotate(a);
  const s = W / 240;
  mctx.beginPath(); mctx.moveTo(0, 0); mctx.arc(0, 0, 26 * s, -.45, .45); mctx.closePath();
  mctx.fillStyle = 'rgba(255,240,200,.18)'; mctx.fill();
  mctx.beginPath(); mctx.moveTo(8 * s, 0); mctx.lineTo(-5 * s, 5 * s); mctx.lineTo(-2 * s, 0); mctx.lineTo(-5 * s, -5 * s); mctx.closePath();
  mctx.fillStyle = '#fff4dc'; mctx.fill(); mctx.strokeStyle = '#1a120d'; mctx.lineWidth = 1 * s; mctx.stroke();
  mctx.restore();
}
setupMap();

/* =========================================================
   Bucle principal
   ========================================================= */
const clock = new THREE.Clock();
const progressBar = $('#progress i');
function update(dt) {
  if (free) { controls.update(); return; }
  if (playing) {
    if (state === 'dwell') {
      dwellT -= dt;
      if (dwellT <= 0 && cur < STOPS.length - 1) startMove();
      if (dwellT <= 0 && cur === STOPS.length - 1) { playing = false; updatePlayIcon(); }
    } else {
      const u0 = stopU[cur], u1 = stopU[cur + 1];
      posCurve.getPoint(u, q0); posCurve.getPoint(Math.min(1, u + .0005), q1);
      const dPdu = Math.max(1e-3, q0.distanceTo(q1) / .0005);
      const f = (u - u0) / (u1 - u0);
      const ease = Math.max(.12, Math.min(1, f * 7, (1 - f) * 7));
      u += 15 * speedMul * ease * dt / dPdu;
      if (u >= u1) { u = u1; cur++; state = 'dwell'; dwellT = DWELL; showStop(cur); }
    }
  }
  cardBar.style.width = state === 'dwell' ? (Math.min(1, 1 - dwellT / DWELL) * 100).toFixed(1) + '%' : '0%';
  pose(u);
  if (blend) {
    blend.t = Math.min(1, blend.t + dt / 1.3);
    const e = blend.t * blend.t * (3 - 2 * blend.t);
    camera.position.copy(blend.p).lerp(pP, e);
    camera.quaternion.copy(blend.q).slerp(pQ, e);
    if (blend.t >= 1) blend = null;
  } else { camera.position.copy(pP); camera.quaternion.copy(pQ); }
}
function updateFlag(t) {
  if (!flagMesh) return;
  const p = flagMesh.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i) + 2.1; p.setZ(i, Math.sin(x * 1.6 - t * 5) * .25 * (x / 4.2)); }
  p.needsUpdate = true; flagMesh.geometry.computeVertexNormals();
}
function frame() {
  const dt = Math.min(clock.getDelta(), .05);
  time += dt;
  update(dt);
  sky.position.copy(camera.position);
  updateJets(time); updateBirds(time); updateFlag(time);
  updateLabels(); drawMap();
  progressBar.style.width = (u * 100).toFixed(2) + '%';
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
const hm = /parada=(\d+)/.exec(location.hash);
if (hm) { cur = Math.max(0, Math.min(STOPS.length - 1, +hm[1] - 1)); u = stopU[cur]; }
showStop(cur);
pose(u); camera.position.copy(pP); camera.quaternion.copy(pQ);
renderer.render(scene, camera);
requestAnimationFrame(() => { $('#loader').classList.add('gone'); frame(); });
})();
</script>
