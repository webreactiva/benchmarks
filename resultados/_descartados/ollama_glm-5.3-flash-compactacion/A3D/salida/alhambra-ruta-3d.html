<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Alhambra — Ruta en 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0e0906;font-family:Georgia,'Times New Roman',serif}
canvas#scene{position:fixed;inset:0;display:block}
#title{position:fixed;top:22px;left:26px;color:#f4e9cf;text-shadow:0 1px 8px rgba(20,8,4,.65);z-index:5;pointer-events:none}
#title h1{font-size:30px;letter-spacing:3px;font-weight:600}
#title p{font-size:13px;letter-spacing:2px;color:#e0c99a;margin-top:4px}
#stops{position:fixed;right:26px;top:50%;transform:translateY(-50%);list-style:none;z-index:5;max-height:80vh;overflow:auto}
#stops li{padding:7px 12px;margin:4px 0;font-size:13px;color:#eecfa3;background:rgba(40,12,7,.55);border-left:2px solid rgba(201,163,92,.35);cursor:pointer;transition:all .25s;white-space:nowrap}
#stops li:hover{background:rgba(70,25,15,.75)}
#stops li.sel{background:rgba(84,28,16,.9);border-left-color:#c9a35c;color:#f7ead0}
#hud{position:fixed;left:26px;bottom:24px;width:min(560px,calc(100vw - 52px));background:rgba(38,11,6,.82);border:1px solid rgba(201,163,92,.55);padding:16px 18px 14px;z-index:6;backdrop-filter:blur(6px)}
#bar{height:3px;background:rgba(201,163,92,.25);margin-bottom:12px}
#fill{height:100%;width:12.5%;background:linear-gradient(90deg,#c9a35c,#ecd9a0);transition:width .5s}
#row{display:flex;gap:16px;align-items:stretch}
#txt{flex:1;min-width:0}
#num{font-size:11px;letter-spacing:2px;color:#c9a35c}
#name{font-size:21px;color:#f7ead0;margin:2px 0 6px;font-weight:600}
#desc{font-size:13px;line-height:1.45;color:#d9c3a4}
#btns{display:flex;flex-direction:column;gap:6px;justify-content:center}
#btns button{font-family:inherit;font-size:12.5px;letter-spacing:1px;color:#edd9ae;background:transparent;border:1px solid rgba(201,163,92,.6);padding:7px 14px;cursor:pointer;transition:all .2s;white-space:nowrap}
#btns button:hover,#btns button.on{background:#c9a35c;color:#2a1008}
#banner{position:fixed;left:50%;top:14%;transform:translate(-50%,-12px);background:rgba(44,12,6,.85);border:1px solid rgba(201,163,92,.6);color:#f2e2bf;padding:10px 26px;font-size:15px;letter-spacing:2px;opacity:0;transition:all .4s;z-index:7;pointer-events:none}
#banner.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){#stops{display:none}#title h1{font-size:22px}#hud{width:calc(100vw - 24px);left:12px;bottom:12px}#btns button{padding:6px 9px;font-size:11px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="title"><h1>LA ALHAMBRA</h1><p>GRANADA · ITINERARIO EN 3D</p></div>
<ul id="stops"></ul>
<div id="banner"></div>
<div id="hud">
  <div id="bar"><div id="fill"></div></div>
  <div id="row">
    <div id="txt">
      <div id="num"></div>
      <h2 id="name"></h2>
      <p id="desc"></p>
    </div>
    <div id="btns">
      <button id="prev">&#8592; Anterior</button>
      <button id="next">Siguiente &#8594;</button>
      <button id="auto">Auto</button>
    </div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd4e2ef);
scene.fog = new THREE.FogExp2(0xd4e2ef, 0.0026);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 2400);
camera.position.set(210, 140, 230);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.45;
controls.minDistance = 8;
controls.maxDistance = 420;
controls.target.set(60, 12, 80);

const sun = new THREE.DirectionalLight(0xfff2dd, 2.4);
sun.position.set(150, 190, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -200;
sun.shadow.camera.right = 200;
sun.shadow.camera.top = 160;
sun.shadow.camera.bottom = -160;
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 700;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfe4f2, 0x6b6a4a, 0.75));

function gauss(x, z, cx, cz, s) {
  const dx = x - cx, dz = z - cz;
  return Math.exp(-(dx * dx + dz * dz) / (2 * s * s));
}
function groundHeight(x, z) {
  let h = Math.sin(x * 0.045) * 1.4 + Math.cos(z * 0.05) * 1.2 + Math.sin((x + z) * 0.028) * 1.6;
  h += gauss(x, z, -60, 10, 30) * 5;
  h += gauss(x, z, 25, -15, 40) * 4;
  h += gauss(x, z, 115, -35, 20) * 6;
  h -= gauss(x, z, 88, 0, 7) * 3;
  return h;
}

const terraGeo = new THREE.PlaneGeometry(300, 220, 140, 100);
terraGeo.rotateX(-Math.PI / 2);
const tp = terraGeo.attributes.position;
const tcols = [];
const cA = new THREE.Color(0x8a9a52), cB = new THREE.Color(0x6d7c3e), cC = new THREE.Color(0x5b6b33);
for (let i = 0; i < tp.count; i++) {
  const x = tp.getX(i), z = tp.getZ(i);
  const h = groundHeight(x, z);
  tp.setY(i, h);
  const col = cA.clone().lerp(cB, THREE.MathUtils.clamp((h + 2) / 9, 0, 1));
  if (x > 80) col.lerp(cC, 0.3);
  tcols.push(col.r, col.g, col.b);
}
terraGeo.setAttribute('color', new THREE.Float32BufferAttribute(tcols, 3));
terraGeo.computeVertexNormals();
const terrain = new THREE.Mesh(terraGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
terrain.receiveShadow = true;
scene.add(terrain);

const matCache = new Map();
function M(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, ...opts }));
  return matCache.get(key);
}
const wallMat = M(0x9b4a33);
const wall2Mat = M(0x8a4230);
const roofMat = M(0x2e5938);
const stoneMat = M(0xd6c8a8);
const colMat = M(0xd9cfb8);
const waterMat = M(0x3d7fa8, { roughness: 0.25, metalness: 0.3, transparent: true, opacity: 0.92 });
const hedgeMat = M(0x3c5a28);
const crenMat = M(0x8a4230);

function box(w, h, d, x, baseY, z, mat = wallMat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, baseY + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function cyl(rt, rb, h, x, baseY, z, mat, seg = 14, open = false) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat);
  m.position.set(x, baseY + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function cone(r, h, x, baseY, z, mat, seg = 4) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg, 1), mat);
  m.position.set(x, baseY + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function torus(r, tube, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 10, 48), mat);
  m.position.set(x, y, z);
  m.rotation.x = -Math.PI / 2;
  m.castShadow = true;
  scene.add(m);
  return m;
}
function roofPlate(x, yTop, z, w, d) {
  box(w + 0.8, 0.6, d + 0.8, x, yTop, z, roofMat);
}
function wallSeg(x1, z1, x2, z2, h, thick = 2, mat = wallMat) {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, thick), mat);
  const base = Math.min(groundHeight(x1, z1), groundHeight(x2, z2)) - 0.5;
  m.position.set((x1 + x2) / 2, base + h / 2, (z1 + z2) / 2);
  m.rotation.y = -Math.atan2(dz, dx);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}
function crenellate(x, z, w, d, topY) {
  const nx = Math.max(2, Math.round(w / 2.4));
  const dxw = w / nx;
  for (let i = 0; i < nx; i++) {
    const ox = -w / 2 + (i + 0.5) * dxw;
    box(1.2, 1.4, 1.1, x + ox, topY, z - d / 2 + 0.6, crenMat);
    box(1.2, 1.4, 1.1, x + ox, topY, z + d / 2 - 0.6, crenMat);
  }
  const nz = Math.max(2, Math.round(d / 2.4));
  const dzw = d / nz;
  for (let j = 1; j < nz - 1; j++) {
    const oz = -d / 2 + (j + 0.5) * dzw;
    box(1.1, 1.4, 1.2, x - w / 2 + 0.6, topY, z + oz, crenMat);
    box(1.1, 1.4, 1.2, x + w / 2 - 0.6, topY, z + oz, crenMat);
  }
}
function tower(x, z, w, d, h, mat = wall2Mat) {
  const b = groundHeight(x, z);
  box(w, h, d, x, b - 0.3, z, mat);
  crenellate(x, z, w, d, b - 0.3 + h);
  return b - 0.3 + h;
}
function archFrame(w, h, depth, hwr = 0.2, y0r = 0.5) {
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, 0);
  shape.lineTo(w / 2, 0);
  shape.lineTo(w / 2, h);
  shape.lineTo(-w / 2, h);
  shape.closePath();
  const hw = w * hwr;
  const y0 = h * y0r;
  const hole = new THREE.Path();
  hole.moveTo(-hw, 0);
  hole.lineTo(-hw, y0);
  hole.absarc(0, y0, hw, Math.PI, 0, true);
  hole.lineTo(hw, 0);
  hole.closePath();
  shape.holes.push(hole);
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false }), wallMat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

const gate = archFrame(26, 15, 4, 0.2, 0.5);
const gateBase = groundHeight(60, 76);
gate.position.set(60, gateBase - 0.4, 74);
scene.add(gate);
tower(44, 76, 8, 8, 13);
tower(76, 76, 8, 8, 13);

wallSeg(-80, -9, -36, -9, 9, 2.3, wall2Mat);
wallSeg(-36, -9, -36, 21, 9, 2.3, wall2Mat);
wallSeg(-36, 21, -80, 21, 9, 2.3, wall2Mat);
wallSeg(-80, 21, -80, -9, 9, 2.3, wall2Mat);
const velaTop = tower(-78, 16, 9, 9, 26);
tower(-42, -6, 8, 8, 17);
const az = groundHeight(-58, 6);
box(7, 6, 6, -68, az, -2, wall2Mat);
roofPlate(-68, az + 6, -2, 7, 6);
box(7, 5, 6, -58, az, -2, wall2Mat);
box(7, 6.5, 6, -48, az, -2, wall2Mat);
roofPlate(-48, az + 6.5, -2, 7, 6);
box(5, 3, 6, -58, az, 10, M(0x8d9096));
cyl(0.09, 0.09, 6, -78, velaTop, 16, M(0x777d80, { metalness: 0.4, roughness: 0.5 }), 6);
box(3.2, 1.8, 0.1, -76.2, velaTop + 4.6, 16, M(0xf2ede2));
box(3.2, 0.5, 0.11, -76.2, velaTop + 4.6, 16, M(0xa02b1e));

const cv = groundHeight(0, 14);
cyl(12.8, 12.8, 0.9, 0, cv - 0.2, 14, stoneMat, 36);
cyl(12, 12, 10.5, 0, cv + 0.7, 14, M(0x9b4a33, { side: THREE.DoubleSide }), 40, true);
torus(12.1, 0.4, 0, cv + 4.5, 14, stoneMat);
torus(12.1, 0.4, 0, cv + 11.2, 14, stoneMat);
const innerW = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 8, 28, 1, true), M(0x8a4230, { side: THREE.DoubleSide }));
innerW.position.set(0, cv + 4.7, 14);
innerW.castShadow = true;
innerW.receiveShadow = true;
scene.add(innerW);
const innerFloor = new THREE.Mesh(new THREE.CircleGeometry(6.3, 32), stoneMat);
innerFloor.rotation.x = -Math.PI / 2;
innerFloor.position.set(0, cv + 0.76, 14);
innerFloor.receiveShadow = true;
scene.add(innerFloor);
const roofRing = new THREE.Mesh(new THREE.RingGeometry(6.4, 12, 44), M(0x8a4230, { side: THREE.DoubleSide }));
roofRing.rotation.x = -Math.PI / 2;
roofRing.position.set(0, cv + 11.2, 14);
scene.add(roofRing);
torus(12.05, 0.45, 0, cv + 11.35, 14, roofMat);

const mx = groundHeight(24, -8);
box(14, 8, 11, 24, mx, -8, wallMat);
roofPlate(24, mx + 8, -8, 14, 11);
tower(17, -3, 5, 5, 11);

const ar = groundHeight(25, -30);
box(28, 0.6, 16, 25, ar, -30, stoneMat);
box(17.4, 0.5, 6.4, 25, ar + 0.6, -30, stoneMat);
box(16, 0.35, 5, 25, ar + 0.75, -30, waterMat);
for (let i = 0; i < 7; i++) {
  const cxp = 13.5 + i * (23 / 6);
  cyl(0.34, 0.4, 4.6, cxp, ar + 1.1, -37.4, colMat, 10);
  cyl(0.34, 0.4, 4.6, cxp, ar + 1.1, -22.6, colMat, 10);
}
box(24, 0.5, 1, 25, ar + 5.7, -37.4, wall2Mat);
box(24, 0.5, 1, 25, ar + 5.7, -22.6, wall2Mat);
box(24, 10, 2.5, 25, ar, -39.8, wallMat);
tower(25, -47, 14, 12, 20);

const le = groundHeight(25, -62);
box(27, 0.7, 27, 25, le, -62, stoneMat);
for (let i = 0; i < 8; i++) {
  const cxp = 14 + i * (22 / 7);
  cyl(0.32, 0.38, 3.8, cxp, le + 0.7, -50.5, colMat, 10);
  cyl(0.32, 0.38, 3.8, cxp, le + 0.7, -73.5, colMat, 10);
}
for (let j = 0; j < 6; j++) {
  const czp = -53 - j * (19 / 5);
  cyl(0.32, 0.38, 3.8, 12.5, le + 0.7, czp, colMat, 10);
  cyl(0.32, 0.38, 3.8, 37.5, le + 0.7, czp, colMat, 10);
}
cyl(2.3, 2.5, 0.9, 25, le + 0.7, -62, stoneMat, 8);
cyl(1.6, 1.3, 0.5, 25, le + 1.6, -62, colMat, 8);
cyl(1.35, 1.35, 0.12, 25, le + 2.1, -62, waterMat, 8);
for (let k = 0; k < 8; k++) {
  const a = k * Math.PI / 4 + Math.PI / 8;
  const lx = 25 + Math.cos(a) * 3.1, lz = -62 + Math.sin(a) * 3.1;
  const lion = box(0.9, 0.7, 0.6, lx, le + 1.6, lz, colMat);
  lion.rotation.y = -a;
}
const pavPos = [[16.5, -52], [33.5, -52], [16.5, -72], [33.5, -72]];
pavPos.forEach(p => {
  box(7, 6, 7, p[0], le + 0.7, p[1], wall2Mat);
  const cr = cone(5.4, 3.2, p[0], le + 6.7, p[1], roofMat, 4);
  cr.rotation.y = Math.PI / 4;
});

const pa = groundHeight(63, -48);
box(23, 8, 2, 63, pa, -52.5, wallMat);
for (let i = 0; i < 5; i++) {
  const arch = archFrame(3.8, 6.5, 0.9, 0.36, 0.42);
  arch.position.set(54 + i * 4.5, pa, -50.45);
  scene.add(arch);
}
box(23, 0.6, 1.3, 63, pa + 6.5, -50, wall2Mat);
box(18.5, 0.5, 4.5, 63, pa, -45.5, stoneMat);
box(17, 0.3, 3.2, 63, pa + 0.35, -45.5, waterMat);
tower(62, -57, 6, 6, 13);
tower(50, -57, 5, 5, 10);
tower(74, -57, 5, 5, 10);

const ge = groundHeight(118, -34);
box(46, 1.4, 60, 118, ge - 0.3, -34, M(0xcabf9f, { roughness: 0.95 }));
box(27.5, 0.6, 6, 118, ge + 1.1, -34, stoneMat);
box(26, 0.4, 4.8, 118, ge + 1.5, -34, waterMat);
for (let i = 0; i < 11; i++) {
  const cxg = 105 + i * 2.6;
  cyl(0.3, 0.36, 3.4, cxg, ge + 1.5, -38.5, colMat, 10);
  cyl(0.3, 0.36, 3.4, cxg, ge + 1.5, -29.5, colMat, 10);
}
box(28, 0.5, 1.1, 118, ge + 4.9, -38.5, wall2Mat);
box(28, 0.5, 1.1, 118, ge + 4.9, -29.5, wall2Mat);
box(24, 1.7, 1.4, 118, ge + 1.1, -22.5, hedgeMat);
box(24, 1.7, 1.4, 118, ge + 1.1, -45.5, hedgeMat);
for (let i = 0; i < 8; i++) {
  const ox = 106 + i * 3.4;
  for (const oz of [-20.8, -46.2]) {
    cone(0.9, 2, ox, ge + 1.1, oz, M(0x4f6b2f), 7);
    box(0.34, 0.4, 0.34, ox + 0.4, ge + 2.4, oz, M(0xd97b29));
  }
}
box(8, 14, 8, 132, ge + 1.1, -34, M(0xa5442e));
crenellate(132, -34, 8, 8, ge + 15.1);
box(6, 10, 6, 104, ge + 1.1, -34, M(0xa5442e));
crenellate(104, -34, 6, 6, ge + 11.1);
const jets = [];
for (let i = 0; i < 5; i++) {
  const j = new THREE.Mesh(new THREE.ConeGeometry(0.16, 2.2, 6), M(0xeef4f8, { transparent: true, opacity: 0.75 }));
  j.position.set(108 + i * 5, ge + 2.2, -34);
  scene.add(j);
  jets.push(j);
}
for (let z = -8; z >= -64; z -= 8) cone(0.9, 7 + (z % 16) * -0.2, 93, groundHeight(93, z), z, M(0x2f4a26), 8);

const route = [
  [60, 86], [46, 68], [8, 48], [-40, 26], [-56, 22], [-58, -6], [-38, 8], [-10, 16],
  [2, 24], [20, 6], [24, -2], [25, -21], [40, -40], [30, -56], [25, -64], [40, -58],
  [58, -48], [63, -44], [78, -30], [96, -20], [118, -18]
];
const routePts = [];
for (const p of route) {
  const lift = p[0] > 95.5 ? 1.4 : 0;
  routePts.push(new THREE.Vector3(p[0], groundHeight(p[0], p[1]) + lift + 0.75, p[1]));
}
const routeGeo = new THREE.BufferGeometry().setFromPoints(routePts);
const routeLine = new THREE.Line(routeGeo, new THREE.LineDashedMaterial({ color: 0x7a251b, dashSize: 2.4, gapSize: 1.6, transparent: true, opacity: 0.95, depthTest: false }));
routeLine.computeLineDistances();
routeLine.renderOrder = 5;
scene.add(routeLine);

const stops = [
  { name: 'Puerta de la Justicia', labelY: 28, pos: [70, 24, 124], tgt: [60, 12, 80],
    desc: 'Erigida en 1348 bajo Yusuf I, es la entrada emblemática del recinto. Su arco de herradura se corona con la mano y la llave talladas en piedra.' },
  { name: 'Alcazaba', labelY: 31, pos: [-104, 38, 58], tgt: [-58, 12, 4],
    desc: 'La parte más antigua del conjunto, fortaleza militar desde el siglo XIII. La Torre de la Vela, con su bandera, ofrece las mejores vistas de Granada y Sierra Nevada.' },
  { name: 'Palacio de Carlos V', labelY: 22, pos: [52, 34, 58], tgt: [0, 10, 14],
    desc: 'Renacimiento en plena Alhambra: Pedro Machuca lo diseñó en 1527 con un patio circular inscrito en un cuadrado. Hoy acoge los museos del monumento.' },
  { name: 'Mexuar', labelY: 16, pos: [50, 20, 26], tgt: [24, 6, -6],
    desc: 'Salón de audiencias y justicia del Estado nazarí, puerta a las dependencias de gobierno. Aquí despachaban el visir y los secretarios del sultán.' },
  { name: 'Patio de los Arrayanes', labelY: 17, pos: [52, 16, -12], tgt: [25, 6, -28],
    desc: 'Jardín de proporciones serenas con una alberca espejada al pie de la Torre de Comares. Tras su muro espera el Salón de Embajadores, trono del sultán.' },
  { name: 'Patio de los Leones', labelY: 15, pos: [56, 14, -32], tgt: [25, 6, -60],
    desc: 'Construido por Mohamed V: columnas de mármol sostienen los cuatro pabellones en torno a la fuente de los doce leones. Es el símbolo del paraíso soñado.' },
  { name: 'Partal', labelY: 20, pos: [88, 26, -16], tgt: [63, 8, -52],
    desc: 'El barrio residencial más antiguo que se conserva, con su pórtico de cinco arcos frente a la alberca y la Torre de las Damas.' },
  { name: 'Generalife', labelY: 22, pos: [156, 34, 4], tgt: [118, 9, -34],
    desc: 'La villa de recreo de los sultanes nazaríes. Su Patio de la Acequia alarga un estanque entre setos y surtidores bajo la mirada de Sierra Nevada.' }
];

const markerSpots = [[60, 84], [-58, 24], [2, 26], [24, -2], [25, -21], [25, -64], [63, -44], [118, -18]];
function makeLabel(text) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(58,16,9,0.88)';
  ctx.strokeStyle = '#c9a35c';
  ctx.lineWidth = 6;
  const r = 24, x0 = 6, y0 = 6, w = 500, h = 116;
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.lineTo(x0 + w - r, y0);
  ctx.arcTo(x0 + w, y0, x0 + w, y0 + r, r);
  ctx.lineTo(x0 + w, y0 + h - r);
  ctx.arcTo(x0 + w, y0 + h, x0 + w - r, y0 + h, r);
  ctx.lineTo(x0 + r, y0 + h);
  ctx.arcTo(x0, y0 + h, x0, y0 + h - r, r);
  ctx.lineTo(x0, y0 + r);
  ctx.arcTo(x0, y0, x0 + r, y0, r);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.font = '600 46px Georgia, serif';
  ctx.fillStyle = '#f6ead2';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 66);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.renderOrder = 30;
  const sw = 5.5 + text.length * 0.28;
  sp.scale.set(sw, sw * 0.25, 1);
  return sp;
}
const markers = [];
const rings = [];
markerSpots.forEach((p, i) => {
  const gy = groundHeight(p[0], p[1]) + (p[0] > 95.5 ? 1.4 : 0);
  const mk = cone(1.05, 2.3, p[0], 0, p[1], M(0xb43a28), 12);
  mk.position.set(p[0], gy + 1.2, p[1]);
  mk.userData.by = gy + 1.2;
  mk.userData.phase = i * 1.7;
  scene.add(mk);
  markers.push(mk);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.55, 0.12, 8, 24), M(0xc9a35c, { metalness: 0.5, roughness: 0.4 }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(p[0], gy + 0.12, p[1]);
  scene.add(ring);
  rings.push(ring);
  const lab = makeLabel(`${i + 1} · ${stops[i].name}`);
  lab.position.set(p[0], gy + stops[i].labelY, p[1]);
  scene.add(lab);
});

let seed = 7;
function rnd() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}
const zones = [[60, 82, 24], [-58, 6, 40], [12, -30, 52], [63, -50, 24], [118, -34, 36], [25, -62, 26]];
function freeSpot(x, z) {
  for (const zn of zones) {
    const dx = x - zn[0], dz = z - zn[1];
    if (Math.sqrt(dx * dx + dz * dz) < zn[2]) return false;
  }
  return true;
}
const trunkMat = M(0x6b4a2a);
let placed = 0;
for (let i = 0; i < 160 && placed < 78; i++) {
  const x = -140 + rnd() * 290;
  const z = -110 + rnd() * 215;
  if (!freeSpot(x, z)) continue;
  const gy = groundHeight(x, z);
  if (rnd() < 0.35) {
    const th = 6 + rnd() * 3;
    cyl(0.16, 0.2, 1.2, x, gy, z, trunkMat, 6);
    cone(0.9 + rnd() * 0.5, th, x, gy + 0.8, z, M(0x2f4a26), 8);
  } else {
    cyl(0.22, 0.3, 1.6, x, gy, z, trunkMat, 6);
    const r = 1.2 + rnd() * 1.1;
    const canopy = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 6), M(rnd() < 0.5 ? 0x4f6b2f : 0x5d7a33));
    canopy.position.set(x, gy + 1.5 + r * 0.7, z);
    canopy.castShadow = true;
    scene.add(canopy);
  }
  placed++;
}

for (let i = 0; i < 6; i++) {
  const sx = -220 + i * 95 + rnd() * 40;
  cone(35 + rnd() * 40, 26 + rnd() * 34, sx, 0, -175 - rnd() * 60, M(0xeef3f7), 7);
}
for (let i = 0; i < 4; i++) {
  const sx = -160 + i * 110 + rnd() * 40;
  cone(45 + rnd() * 20, 20 + rnd() * 14, sx, 0, -148 - rnd() * 14, M(0x74807a), 7);
}

const bannerEl = document.getElementById('banner');
const fillEl = document.getElementById('fill');
const numEl = document.getElementById('num');
const nameEl = document.getElementById('name');
const descEl = document.getElementById('desc');
const stopsUl = document.getElementById('stops');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const autoBtn = document.getElementById('auto');

stops.forEach((s, i) => {
  const li = document.createElement('li');
  li.textContent = `${i + 1} · ${s.name}`;
  li.addEventListener('click', () => {
    setAuto(false);
    goTo(i);
  });
  stopsUl.appendChild(li);
});

let idx = 0;
let camAnim = null;
let auto = false;
let autoTimer = null;

function updateUI() {
  const s = stops[idx];
  fillEl.style.width = `${((idx + 1) / stops.length) * 100}%`;
  numEl.textContent = `PARADA ${idx + 1} DE ${stops.length}`;
  nameEl.textContent = s.name;
  descEl.textContent = s.desc;
  [...stopsUl.children].forEach((c, k) => c.classList.toggle('sel', k === idx));
}
function goTo(i) {
  idx = (i + stops.length) % stops.length;
  updateUI();
  clearTimeout(autoTimer);
  bannerEl.textContent = `Llegando a ${stops[idx].name}`;
  bannerEl.classList.add('on');
  camAnim = {
    t0: performance.now(),
    dur: 2800,
    from: camera.position.clone(),
    fromT: controls.target.clone(),
    to: new THREE.Vector3(...stops[idx].pos),
    toT: new THREE.Vector3(...stops[idx].tgt)
  };
  controls.enabled = false;
}
function setAuto(on) {
  auto = on;
  clearTimeout(autoTimer);
  autoBtn.textContent = on ? 'Detener' : 'Auto';
  autoBtn.classList.toggle('on', on);
  if (on && !camAnim) autoTimer = setTimeout(() => goTo(idx + 1), 5800);
}
prevBtn.addEventListener('click', () => goTo(idx - 1));
nextBtn.addEventListener('click', () => goTo(idx + 1));
autoBtn.addEventListener('click', () => setAuto(!auto));
canvas.addEventListener('pointerdown', () => {
  if (auto) setAuto(false);
  if (camAnim) {
    camAnim = null;
    controls.enabled = true;
    bannerEl.classList.remove('on');
    clearTimeout(autoTimer);
  }
});
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight') {
    e.preventDefault();
    setAuto(false);
    goTo(idx + 1);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    setAuto(false);
    goTo(idx - 1);
  }
});
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (camAnim) {
    const u = Math.min((performance.now() - camAnim.t0) / camAnim.dur, 1);
    const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    camera.position.lerpVectors(camAnim.from, camAnim.to, e);
    camera.position.y += Math.sin(u * Math.PI) * Math.min(30, camAnim.from.distanceTo(camAnim.to) * 0.16);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    camera.lookAt(controls.target);
    if (u >= 1) {
      camAnim = null;
      controls.enabled = true;
      bannerEl.classList.remove('on');
      if (auto) autoTimer = setTimeout(() => goTo(idx + 1), 5800);
    }
  }
  controls.update();
  markers.forEach((m, i) => {
    m.position.y = m.userData.by + Math.sin(t * 2.2 + m.userData.phase) * 0.3;
    rings[i].scale.setScalar(1 + Math.sin(t * 2.6 + i) * 0.09);
  });
  jets.forEach((j, i) => {
    j.scale.y = 0.75 + Math.sin(t * 3.1 + i * 1.3) * 0.3;
  });
  renderer.render(scene, camera);
}
updateUI();
animate();
setTimeout(() => goTo(0), 1000);
</script>
</body>
