<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruta 3D - Alhambra de Granada</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b3d2e;font-family:system-ui,Segoe UI,Roboto,sans-serif;}
  #ui{position:fixed;top:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;padding:12px 14px;border-radius:10px;max-width:300px;backdrop-filter:blur(4px);}
  #ui h1{font-size:16px;margin:0 0 6px;}
  #ui p{font-size:12px;margin:4px 0;opacity:.9;}
  #stops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .stop{background:#d4af37;color:#222;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px;}
  .stop:hover{background:#e7c35a;}
  #info{position:fixed;bottom:12px;left:12px;background:rgba(0,0,0,.55);color:#fff;padding:10px 14px;border-radius:10px;max-width:360px;backdrop-filter:blur(4px);font-size:13px;}
  #legend{position:fixed;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .label{color:#fff;font-size:11px;background:rgba(0,0,0,.4);padding:2px 6px;border-radius:4px;white-space:nowrap;}
</style>
</head>
<body>
<div id="ui">
  <h1>Alhambra de Granada</h1>
  <p>Ruta 3D por el conjunto monumental. Pulsa un punto o "Tour".</p>
  <div id="stops"></div>
  <div style="margin-top:8px;display:flex;gap:6px;">
    <button class="stop" id="tourBtn">Tour automático</button>
    <button class="stop" id="resetBtn">Vista general</button>
  </div>
</div>
<div id="info">Selecciona un punto de la ruta.</div>
<div id="legend">
  <div><span class="dot" style="background:#c94c4c"></span>Palacios nasridas</div>
  <div><span class="dot" style="background:#8b7355"></span>Fortaleza (Alcazaba)</div>
  <div><span class="dot" style="background:#2e7d32"></span>Jardines (Generalife)</div>
  <div><span class="dot" style="background:#a08a6b"></span>Otros edificios</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b9e6);
scene.fog=new THREE.Fog(0x87b9e6,120,400);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,120,160);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
renderer.domElement.id='canvas';

const labelRenderer=new THREE.CSS2DRenderer();
labelRenderer.setSize(innerWidth,innerHeight);
labelRenderer.domElement.style.position='absolute';
labelRenderer.domElement.style.top='0';
labelRenderer.domElement.style.pointerEvents='none';
document.body.appendChild(labelRenderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.maxPolarAngle=Math.PI/2.1;

const hemi=new THREE.HemisphereLight(0xffffff,0x445566,0.7);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4d6,0.9);
sun.position.set(80,150,60);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(500,500,80,80),
  new THREE.MeshStandardMaterial({color:0x5a8f4a,roughness:0.9})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function box(cx,cy,cz,w,h,d,color=0xa08a6b,cat='other'){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:0.8}));
  m.position.set(cx,cy+h/2,cz);
  m.castShadow=true;m.receiveShadow=true;
  m.userData.cat=cat;
  scene.add(m);
  return m;
}
function wall(cx,cz,w,d,h=8,color=0xb8a88a){
  return box(cx,h/2,cz,w,h,d,color);
}

box(0,0,0,60,6,40,0xc94c4c,'nasrid');
box(-15,6,0,18,10,24,0xc94c4c,'nasrid');
box(10,6,0,16,9,20,0xc94c4c,'nasrid');
box(10,6,-18,22,7,14,0xc94c4c,'nasrid');
box(25,6,0,12,8,16,0xc94c4c,'nasrid');

box(-70,0,50,45,12,35,0x8b7355,'fort');
wall(-70,50,45,1,14,0x8b7355);
wall(-70,68,1,35,14,0x8b7355);

box(70,0,-60,30,4,50,0x2e7d32,'garden');
box(70,4,-60,24,2,44,0x2e7d32,'garden');

for(let x=-120;x<=120;x+=40){
  box(x,0,90,4,18,4,0x9e9e9e,'other');
  box(x,0,-90,4,18,4,0x9e9e9e,'other');
}
for(let z=-90;z<=90;z+=30){
  box(120,0,z,4,18,4,0x9e9e9e,'other');
  box(-120,0,z,4,18,4,0x9e9e9e,'other');
}

box(-30,0,-70,26,5,20,0xa08a6b,'other');
box(-30,0,70,20,5,16,0xa08a6b,'other');

const stops=[
 {name:'Entrada / Puerta de la Justicia',pos:[-10,0,-110],txt:'Acceso principal al recinto, puerta nazarí del siglo XIV.'},
 {name:'Alcazaba',pos:[-70,0,50],txt:'Fortaleza militar más antigua, con vistas a Granada.'},
 {name:'Palacios Nazaríes',pos:[0,0,0],txt:'Mexuar, Comares, Palacio de los Leones: joya del arte nazarí.'},
 {name:'Patio de los Leones',pos:[10,0,-18],txt:'Fuente de los Doce Leones y galerías de estuco.'},
 {name:'Palacio de Carlos V',pos:[-30,0,-70],txt:'Renacimiento, sede del Museo de la Alhambra.'},
 {name:'Generalife',pos:[70,0,-60],txt:'Palacio de verano y jardines escalonados.'},
 {name:'Ruta completa',pos:[0,0,0],txt:'Recorrido circular por todos los puntos.'}
];

const stopGroup=new THREE.Group();
scene.add(stopGroup);
const markers=[];
stops.forEach((s,i)=>{
  const m=new THREE.Mesh(new THREE.SphereGeometry(2.4,16,16),new THREE.MeshStandardMaterial({color:0xd4af37,emissive:0x7a5a00}));
  m.position.set(s.pos[0],4,s.pos[2]);
  m.userData={index:i};
  stopGroup.add(m);
  markers.push(m);
  const div=document.createElement('div');div.className='label';div.textContent=s.name;
  const lbl=new THREE.CSS2DObject(div);
  lbl.position.set(s.pos[0],12,s.pos[2]);
  stopGroup.add(lbl);
});

const curvePoints=stops.slice(0,6).map(s=>new THREE.Vector3(s.pos[0],4,s.pos[2]));
curvePoints.push(new THREE.Vector3(stops[0].pos[0],4,stops[0].pos[2]));
const curve=new THREE.CatmullRomCurve3(curvePoints,true);
const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,200,0.8,8,false),new THREE.MeshStandardMaterial({color:0xd4af37,emissive:0x6b5a00}));
scene.add(tube);

const walker=new THREE.Mesh(new THREE.SphereGeometry(1.8,16,16),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff}));
scene.add(walker);

const stopsDiv=document.getElementById('stops');
stops.forEach((s,i)=>{
  const b=document.createElement('button');b.className='stop';b.textContent=s.name.split('/')[0].trim();
  b.onclick=()=>gotoStop(i);stopsDiv.appendChild(b);
});
document.getElementById('tourBtn').onclick=startTour;
document.getElementById('resetBtn').onclick=resetView;
const info=document.getElementById('info');

let touring=false,tourT=0;
function startTour(){touring=true;tourT=0;}
function resetView(){camera.position.set(0,120,160);controls.target.set(0,0,0);touring=false;}
function gotoStop(i){
  const s=stops[i];
  info.textContent=s.name+': '+s.txt;
  camera.position.set(s.pos[0],40,s.pos[2]+35);
  controls.target.set(s.pos[0],0,s.pos[2]);
  touring=false;
}
const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(markers);
  if(hits.length){gotoStop(hits[0].object.userData.index);}
});

let prev=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const dt=Math.min(0.05,(now-prev)/1000);prev=now;
  if(touring){
    tourT=(tourT+dt*0.08)%1;
    const p=curve.getPointAt(tourT);
    walker.position.copy(p);
    camera.position.lerp(new THREE.Vector3(p.x+25,p.y+30,p.z+25),0.05);
    controls.target.lerp(new THREE.Vector3(p.x,0,p.z),0.1);
  }else{
    const t=now*0.001;
    walker.position.copy(curve.getPointAt((Math.sin(t*0.1)*0.5+0.5)));
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
