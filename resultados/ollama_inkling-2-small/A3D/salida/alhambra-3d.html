<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14100a">
<title>La Alhambra · Recorrido 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%2314100a%22/><text x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 fill=%22%23d8b36a%22 font-family=%22Georgia%22>A</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --gold:#d8b36a;
    --gold-dim:rgba(216,179,106,.35);
    --ink:#f3e9d2;
    --panel:rgba(18,15,10,.82);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#14100a;font-family:Georgia,'Times New Roman',serif}
  #scene{position:fixed;inset:0}
  canvas{display:block}

  /* ── Cabecera ─────────────────────────────── */
  header{
    position:fixed;top:16px;left:16px;z-index:20;
    background:var(--panel);border:1px solid var(--gold-dim);border-left:4px solid var(--gold);
    border-radius:12px;padding:10px 18px 11px;backdrop-filter:blur(6px);
    box-shadow:0 8px 32px rgba(0,0,0,.45);max-width:min(420px,calc(100vw - 32px));
  }
  header h1{font-size:1.35rem;letter-spacing:.12em;color:var(--gold);font-weight:normal;text-transform:uppercase}
  header p{font-size:.72rem;color:var(--ink);opacity:.85;margin-top:2px;letter-spacing:.05em}

  /* ── Índice lateral de paradas ─────────────── */
  #sideNav{
    position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;
    display:flex;flex-direction:column;gap:4px;max-height:80vh;overflow:auto;
    background:var(--panel);border:1px solid var(--gold-dim);border-radius:12px;
    padding:10px 8px;backdrop-filter:blur(6px);scrollbar-width:thin;
  }
  .nav-item{
    display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;
    color:var(--ink);opacity:.72;padding:5px 9px;border-radius:8px;text-align:left;
    font-family:inherit;font-size:.78rem;letter-spacing:.02em;transition:all .25s;white-space:nowrap;
  }
  .nav-item .n{
    width:21px;height:21px;flex:0 0 21px;border:1px solid var(--gold);border-radius:50%;
    color:var(--gold);font-size:.68rem;display:flex;align-items:center;justify-content:center;
  }
  .nav-item:hover{opacity:1;background:rgba(216,179,106,.12)}
  .nav-item.active{opacity:1;background:rgba(216,179,106,.18);box-shadow:inset 0 0 0 1px var(--gold-dim)}
  .nav-item.active .n{background:var(--gold);color:#14100a}

  /* ── Panel inferior ────────────────────────── */
  #panel{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;
    width:min(640px,calc(100vw - 28px));
    background:var(--panel);border:1px solid var(--gold-dim);border-radius:14px;
    backdrop-filter:blur(8px);padding:12px 16px 12px;color:var(--ink);
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  #stopMeta{display:flex;align-items:baseline;gap:12px}
  #stopIndex{font-size:.7rem;color:var(--gold);letter-spacing:.22em;white-space:nowrap}
  #stopTitle{font-size:1.15rem;color:#f7efdd;letter-spacing:.03em}
  #stopText{font-size:.82rem;line-height:1.45;opacity:.92;margin:6px 0 10px;font-style:italic;min-height:2.4em}
  #controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{
    background:rgba(216,179,106,.08);border:1px solid var(--gold-dim);color:var(--gold);
    border-radius:9px;height:36px;min-width:40px;padding:0 12px;font-size:1rem;cursor:pointer;
    font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:6px;letter-spacing:.04em;
  }
  .btn:hover{background:rgba(216,179,106,.22);box-shadow:0 0 12px rgba(216,179,106,.25)}
  .btn.active{background:var(--gold);color:#14100a;border-color:var(--gold)}
  .btn.wide{font-size:.75rem;text-transform:uppercase}
  #btnAuto.pulse{animation:pulse 2.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(216,179,106,.45)}50%{box-shadow:0 0 0 6px rgba(216,179,106,0)}}
  #dots{display:flex;gap:6px;margin-left:auto;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold-dim);background:transparent;cursor:pointer;padding:0;transition:all .25s}
  .dot.active{background:var(--gold);transform:scale(1.35);border-color:var(--gold)}

  /* ── Etiquetas 3D ─────────────────────────── */
  #labels{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
  .stop-label{
    position:absolute;transform:translate(-50%,-115%);pointer-events:auto;cursor:pointer;
    background:rgba(18,15,10,.78);border:1px solid var(--gold-dim);color:#efe3c4;
    font-size:.66rem;letter-spacing:.06em;padding:3px 9px;border-radius:20px;white-space:nowrap;
    transition:background .2s,color .2s;backdrop-filter:blur(3px);
  }
  .stop-label:hover{background:var(--gold);color:#14100a}

  /* ── Brújula ──────────────────────────────── */
  #compass{
    position:fixed;right:18px;bottom:18px;z-index:20;width:64px;height:64px;border-radius:50%;
    background:var(--panel);border:1px solid var(--gold-dim);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
  }
  #rose{position:relative;width:100%;height:100%;transition:transform .12s linear}
  #rose span{position:absolute;font-size:.6rem;color:var(--ink);opacity:.75}
  #rose .n{top:3px;left:50%;transform:translateX(-50%);color:var(--gold);opacity:1;font-weight:bold}
  #rose .s{bottom:3px;left:50%;transform:translateX(-50%)}
  #rose .e{right:5px;top:50%;transform:translateY(-50%)}
  #rose .w{left:5px;top:50%;transform:translateY(-50%)}
  #needle{position:absolute;left:50%;top:50%;width:2px;height:20px;background:linear-gradient(var(--gold) 50%,transparent 50%);transform:translate(-50%,-100%);border-radius:2px}

  /* ── Aviso vista libre ─────────────────────── */
  #hint{
    position:fixed;top:18px;left:50%;transform:translate(-50%,-12px);z-index:20;opacity:0;pointer-events:none;
    background:var(--panel);border:1px solid var(--gold-dim);color:var(--ink);border-radius:24px;
    padding:7px 20px;font-size:.75rem;letter-spacing:.05em;transition:all .35s;
  }
  #hint.show{opacity:1;transform:translate(-50%,0)}

  #fallback{display:none;position:fixed;inset:0;z-index:50;background:#14100a;color:var(--ink);
    align-items:center;justify-content:center;text-align:center;padding:2rem;font-size:1rem;line-height:1.6}

  @media (max-width:980px){#sideNav{display:none}}
  @media (max-width:640px){
    header h1{font-size:1.02rem}
    header p{display:none}
    #stopText{font-size:.75rem;min-height:3.2em}
    #compass{display:none}
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>

<header>
  <h1>La Alhambra</h1>
  <p>Recorrido 3D · Palacios Nazaríes · Alcazaba · Generalife</p>
</header>

<nav id="sideNav" aria-label="Paradas del recorrido"></nav>

<div id="panel" role="region" aria-label="Información de la parada">
  <div id="stopMeta">
    <span id="stopIndex">1 / 9</span>
    <h2 id="stopTitle">Cargando…</h2>
  </div>
  <p id="stopText"></p>
  <div id="controls">
    <button class="btn" id="btnPrev" title="Parada anterior" aria-label="Anterior">&#8249;</button>
    <button class="btn" id="btnAuto" title="Recorrido automático"><span id="autoIcon">&#9654;</span> <span id="autoText">Recorrido</span></button>
    <button class="btn" id="btnNext" title="Parada siguiente" aria-label="Siguiente">&#8250;</button>
    <button class="btn wide" id="btnFree" title="Orbitar libremente por el escenario">Vista libre</button>
    <div id="dots"></div>
  </div>
</div>

<div id="compass" aria-hidden="true"><div id="rose">
  <div id="needle"></div>
  <span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">O</span>
</div></div>

<div id="hint">Vista libre — arrastra para orbitar · rueda para acercar</div>
<div id="fallback"><p>No se pudo iniciar WebGL.<br>Prueba con un navegador actualizado (Chrome, Firefox, Edge o Safari).</p></div>

<script>
(function(){
'use strict';
if(!window.THREE){ document.getElementById('fallback').style.display='flex'; return; }

/* ═══════════════ UTILIDADES ═══════════════ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20240611);
const lerp = (a,b,t)=>a+(b-a)*t;
const easeInOutCubic = t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

/* ═══════════════ ESCENA BASE ═══════════════ */
const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if(THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
if(THREE.ACESFilmicToneMapping !== undefined){ renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08; }
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe2d7c0, 245, 860);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1200);
camera.position.set(118, 92, 150);

/* Cielo: domo con gradiente y sol */
const skyGeo = new THREE.SphereGeometry(650, 24, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite:false,
  uniforms:{ sunDir:{ value:new THREE.Vector3(0.55,0.62,0.42).normalize() } },
  vertexShader:[
    'varying vec3 vDir;',
    'void main(){ vDir = normalize(position);',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
  ].join('\n'),
  fragmentShader:[
    'uniform vec3 sunDir; varying vec3 vDir;',
    'void main(){',
    '  float h = clamp(vDir.y, -0.08, 1.0);',
    '  vec3 zen  = vec3(0.32,0.52,0.75);',
    '  vec3 hor  = vec3(0.94,0.88,0.74);',
    '  vec3 col  = mix(hor, zen, pow(smoothstep(-0.05,0.55,h), 0.85));',
    '  float s   = max(dot(normalize(vDir), sunDir), 0.0);',
    '  col += vec3(1.0,0.88,0.62)*pow(s, 350.0)*1.1;',   // disco solar
    '  col += vec3(1.0,0.82,0.55)*pow(s, 18.0)*0.32;',   // halo
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n')
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

/* Luces */
const hemi = new THREE.HemisphereLight(0xbdd2e6, 0x8a7a58, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 1.5);
sun.position.set(120, 150, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -110; sun.shadow.camera.right = 110;
sun.shadow.camera.top = 110;   sun.shadow.camera.bottom = -110;
sun.shadow.camera.near = 20;   sun.shadow.camera.far = 420;
sun.shadow.bias = -0.0006;
sun.target.position.set(0, 8, 0);
scene.add(sun, sun.target);

/* ═══════════════ MATERIALES ═══════════════ */
const MAT = {
  sand:   new THREE.MeshLambertMaterial({color:0xcbb287}),
  sandL:  new THREE.MeshLambertMaterial({color:0xd8c49a}),
  sandD:  new THREE.MeshLambertMaterial({color:0xb09a6e}),
  marble: new THREE.MeshLambertMaterial({color:0xe6ddc8}),
  roof:   new THREE.MeshLambertMaterial({color:0x9d5530}),
  cypress:new THREE.MeshLambertMaterial({color:0x2e4a2b}),
  leaf:   new THREE.MeshLambertMaterial({color:0x40603a}),
  trunk:  new THREE.MeshLambertMaterial({color:0x54402e}),
  dark:   new THREE.MeshLambertMaterial({color:0x241a12}),
  water:  new THREE.MeshPhongMaterial({color:0x2f6f97, specular:0xcfeaff, shininess:90, transparent:true, opacity:0.92, emissive:0x081c28}),
  path:   new THREE.MeshLambertMaterial({color:0xc9b78d}),
  hill:   new THREE.MeshLambertMaterial({color:0xb5a271}),
  hillTop:new THREE.MeshLambertMaterial({color:0x8fa055}),
  ground: new THREE.MeshLambertMaterial({color:0x74904f}),
  rock:   new THREE.MeshLambertMaterial({color:0xa79a80})
};

/* ═══════════════ AYUDANTES DE CONSTRUCCIÓN ═══════════════ (y = base) */
function block(w,h,d,mat,x,y,z,ry){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x, y+h/2, z); if(ry) m.rotation.y = ry;
  m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,seg){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16), mat);
  m.position.set(x, y+h/2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
function cone(r,h,mat,x,y,z,seg){
  const m = new THREE.Mesh(new THREE.ConeGeometry(r,h,seg||12), mat);
  m.position.set(x, y+h/2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
function flat(w,d,mat,x,y,z,ry){ // losa horizontal
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,0.35,d), mat);
  m.position.set(x, y+0.175, z); if(ry) m.rotation.y = ry;
  m.receiveShadow = true; scene.add(m); return m;
}
function column(x,z,baseY,h,r,mat){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r||0.3,(r||0.3)*1.15,h||4,10), mat||MAT.marble);
  m.position.set(x, baseY + (h||4)/2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
function merlons(cx,cz,topY,halfW,halfD,n){
  n = n||5;
  for(let i=0;i<n;i++){
    const t = n===1 ? 0.5 : i/(n-1);
    const dx = lerp(-halfW, halfW, t), dz = lerp(-halfD, halfD, t);
    block(0.8,0.7,0.8,MAT.sandD, cx+dx, topY, cz-halfD, 0);
    block(0.8,0.7,0.8,MAT.sandD, cx+dx, topY, cz+halfD, 0);
    block(0.8,0.7,0.8,MAT.sandD, cx-halfW, topY, cz+dz, 0);
    block(0.8,0.7,0.8,MAT.sandD, cx+halfW, topY, cz+dz, 0);
  }
}
function cypress(x,z,gy,s){
  s = s||1;
  cyl(0.16*s,0.22*s,0.6*s,MAT.trunk,x,gy,z,6);
  cone(0.95*s,4.8*s,MAT.cypress,x,gy+0.5*s,z,8);
}
function orangeTree(x,z,gy){
  cyl(0.15,0.2,0.8,MAT.trunk,x,gy,z,7);
  const c = new THREE.Mesh(new THREE.SphereGeometry(1.15,9,7), MAT.leaf);
  c.scale.y = 0.85; c.position.set(x, gy+1.55, z); c.castShadow = true; scene.add(c);
}
function waterPlane(w,d,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,0.3,d), MAT.water);
  m.position.set(x,y+0.15,z); m.receiveShadow = true; scene.add(m); return m;
}

/* Textura de arcos (yesería nazarí estilizada) */
function makeArchTexture(cols, rows){
  cols = cols||4; rows = rows||1;
  const c = document.createElement('canvas'); c.width = 512; c.height = 256*rows;
  const g = c.getContext('2d');
  g.fillStyle = '#cdb287'; g.fillRect(0,0,c.width,c.height);
  g.strokeStyle = 'rgba(120,95,60,0.5)'; g.lineWidth = 3;
  for(let r=0;r<rows;r++){
    const oy = r*256;
    for(let i=0;i<cols;i++){
      const cx = (i+0.5)*(512/cols);
      // alfiz
      g.strokeRect(cx-72, oy+22, 144, 200);
      // vano de herradura oscuro
      g.fillStyle = '#241a12';
      g.beginPath();
      g.moveTo(cx-36, oy+222);
      g.lineTo(cx-36, oy+128);
      g.arc(cx, oy+128, 36, Math.PI, 0, false);
      g.lineTo(cx+36, oy+222);
      g.closePath(); g.fill();
      g.strokeStyle = '#8a6f4a'; g.lineWidth = 6; g.stroke();
      // dovelas
      g.strokeStyle = 'rgba(216,179,106,0.75)'; g.lineWidth = 2.5;
      for(let a=0;a<=6;a++){
        const ang = Math.PI + (a/6)*Math.PI;
        g.beginPath();
        g.moveTo(cx+Math.cos(ang)*38, oy+128+Math.sin(ang)*38);
        g.lineTo(cx+Math.cos(ang)*52, oy+128+Math.sin(ang)*52);
        g.stroke();
      }
      // adorno superior
      g.fillStyle = '#b99c66';
      g.fillRect(cx-14, oy+30, 28, 8);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}
const archTex  = makeArchTexture(4,1);
const archTex3 = makeArchTexture(3,1);
function archWall(w,h,tex,x,y,z,ry){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshLambertMaterial({map:tex}));
  m.position.set(x,y,z); if(ry) m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m;
}

/* ═══════════════ TERRENO Y ENTORNO ═══════════════ */
{ // llanura de la Vega
  const g = new THREE.Mesh(new THREE.PlaneGeometry(1300,1300), MAT.ground);
  g.rotation.x = -Math.PI/2; g.position.y = -0.05; g.receiveShadow = true; scene.add(g);
}
{ // cerro de la Sabika (meseta elíptica)
  const hill = new THREE.Mesh(new THREE.CylinderGeometry(1,1.22,8.6,48), MAT.hill);
  hill.scale.set(88,1,42); hill.position.y = 3.5; hill.receiveShadow = true; scene.add(hill);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.5,48), MAT.hillTop);
  top.scale.set(88,1,42); top.position.y = 7.95; top.receiveShadow = true; scene.add(top);
}
{ // cerro del Generalife
  const g2 = new THREE.Mesh(new THREE.CylinderGeometry(1,1.18,8.8,32), MAT.hill);
  g2.scale.set(24,1,17); g2.position.set(96,3.4,-10); g2.receiveShadow = true; scene.add(g2);
  const top2 = new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.5,32), MAT.hillTop);
  top2.scale.set(24,1,17); top2.position.set(96,7.95,-10); top2.receiveShadow = true; scene.add(top2);
  block(10,0.9,4,MAT.path,89.2,8,-10); // puentecillo entre la Alhambra y el Generalife
}
{ // río Darro y puente del Cadí
  const r = new THREE.Mesh(new THREE.PlaneGeometry(420,7), new THREE.MeshPhongMaterial({color:0x3d6d8c, shininess:80}));
  r.rotation.x = -Math.PI/2; r.position.set(0,0.12,-36); scene.add(r);
  block(17,1.1,6.4,MAT.sandD,-8,1.6,-36);
  block(2.6,2.2,5.2,MAT.sandD,-13.5,0,-36);
  block(2.6,2.2,5.2,MAT.sandD,-2.5,0,-36);
  block(17,0.5,0.5,MAT.sandL,-8,2.7,-33.2);
  block(17,0.5,0.5,MAT.sandL,-8,2.7,-38.8);
}
{ // carreteras
  const r1 = new THREE.Mesh(new THREE.PlaneGeometry(5.5,150), new THREE.MeshLambertMaterial({color:0x6f675c}));
  r1.rotation.x = -Math.PI/2; r1.position.set(50,0.06,95); scene.add(r1);
  const r2 = new THREE.Mesh(new THREE.PlaneGeometry(340,4.6), new THREE.MeshLambertMaterial({color:0x6f675c}));
  r2.rotation.x = -Math.PI/2; r2.position.set(0,0.07,52); scene.add(r2);
}
// Caminos de la colina
flat(132,4.2,MAT.path,-13,8.21,13);
flat(4.2,34,MAT.path,12,8.22,-1);

/* Sierra Nevada al sur, montes al norte */
function ridge(z,count,rMin,rMax,hMin,hMax,color,snow){
  for(let i=0;i<count;i++){
    const x = -520 + (1040/(count-1))*i + (rand()-0.5)*30;
    const r = rMin + rand()*(rMax-rMin), h = hMin + rand()*(hMax-hMin);
    const m = new THREE.Mesh(new THREE.ConeGeometry(r,h,7), new THREE.MeshLambertMaterial({color:color}));
    m.position.set(x, h/2 - 2, z + (rand()-0.5)*30); scene.add(m);
    if(snow){
      const s = new THREE.Mesh(new THREE.ConeGeometry(r*0.46,h*0.45,7), new THREE.MeshLambertMaterial({color:0xf2f4f7}));
      s.position.set(m.position.x, h*0.775 - 2, m.position.z); scene.add(s);
    }
  }
}
ridge(255, 10, 55, 95, 95, 165, 0x9aa7b8, true);
ridge(150,  9, 42, 68, 42,  78, 0x87927a, false);
ridge(-265, 7, 60, 90, 40,  70, 0x828d74, false);

(function city(){

/* ═══════════════ CÁMARA: RECORRIDO / VISTA LIBRE ═══════════════ */
const state = {
  index: 0,
  mode: 'tour',          // 'tour' | 'free'
  auto: false,
  tween: null,
  holdUntil: 0,
  target: new THREE.Vector3(STOPS[0].tgt[0],STOPS[0].tgt[1],STOPS[0].tgt[2]),
  orbit: { theta: 0.7, phi: 1.05, radius: 150 }
};
function flyTo(pos, tgt, dur){
  state.tween = {
    t:0, dur:dur||2.3,
    p0: camera.position.clone(), p1: new THREE.Vector3(pos[0],pos[1],pos[2]),
    t0: state.target.clone(),    t1: new THREE.Vector3(tgt[0],tgt[1],tgt[2])
  };
}
function goTo(i, fromUser){
  state.index = (i + STOPS.length) % STOPS.length;
  const s = STOPS[state.index];
  state.mode = 'tour';
  document.getElementById('btnFree').classList.remove('active');
  document.getElementById('hint').classList.remove('show');
  flyTo(s.pos, s.tgt, 2.3);
  updatePanel(); updateNav();
  if(fromUser && state.auto){ state.holdUntil = performance.now() + 6500; }
}

/* Órbita libre */
function enterFree(){
  state.mode = 'free';
  const off = camera.position.clone().sub(state.target);
  state.orbit.radius = clamp(off.length(), 12, 400);
  state.orbit.theta  = Math.atan2(off.x, off.z);
  state.orbit.phi    = Math.acos(clamp(off.y/state.orbit.radius, -1, 1));
  document.getElementById('btnFree').classList.add('active');
  document.getElementById('hint').classList.add('show');
}
function exitFree(){
  state.mode = 'tour';
  document.getElementById('btnFree').classList.remove('active');
  document.getElementById('hint').classList.remove('show');
  const s = STOPS[state.index];
  flyTo(s.pos, s.tgt, 1.6);
}
const dom = renderer.domElement;
let dragging = false, lastX = 0, lastY = 0, pinchDist = 0;
dom.addEventListener('pointerdown', function(e){
  if(state.mode !== 'free') return;
  dragging = true; lastX = e.clientX; lastY = e.clientY; dom.setPointerCapture(e.pointerId);
});
dom.addEventListener('pointermove', function(e){
  if(!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  state.orbit.theta -= dx * 0.0052;
  state.orbit.phi    = clamp(state.orbit.phi - dy * 0.0042, 0.18, 1.45);
});
dom.addEventListener('pointerup',   function(){ dragging = false; });
dom.addEventListener('pointercancel',function(){ dragging = false; });
dom.addEventListener('wheel', function(e){
  if(state.mode !== 'free') return;
  e.preventDefault();
  state.orbit.radius = clamp(state.orbit.radius * Math.exp(e.deltaY * 0.0011), 12, 420);
}, {passive:false});
dom.addEventListener('touchmove', function(e){
  if(state.mode === 'free' && e.touches.length === 2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(pinchDist > 0) state.orbit.radius = clamp(state.orbit.radius * (pinchDist/d), 12, 420);
    pinchDist = d;
  }
}, {passive:true});
dom.addEventListener('touchend', function(){ pinchDist = 0; });

  document.getElementById('stopIndex').textContent = (state.index+1)+' / '+STOPS.length;
  document.getElementById('stopTitle').textContent = s.title;
  document.getElementById('stopText').textContent  = s.text;
}
function updateNav(){
  navItems.forEach(function(el,i){ el.classList.toggle('active', i===state.index); });
  dots.forEach(function(el,i){ el.classList.toggle('active', i===state.index); });
}
function setAuto(v){
  state.auto = v;
  document.getElementById('autoIcon').textContent = v ? '⏸' : '▶';
  document.getElementById('autoText').textContent = v ? 'Pausa' : 'Recorrido';
  document.getElementById('btnAuto').classList.toggle('active', v);
  document.getElementById('btnAuto').classList.remove('pulse');
  if(v){ state.holdUntil = 0; goTo(state.index, false); }
}
document.getElementById('btnPrev').addEventListener('click', function(){ setAuto(false); goTo(state.index-1, true); });
document.getElementById('btnNext').addEventListener('click', function(){ setAuto(false); goTo(state.index+1, true); });
document.getElementById('btnAuto').addEventListener('click', function(){ setAuto(!state.auto); });
document.getElementById('btnFree').addEventListener('click', function(){
  if(state.mode === 'free') exitFree(); else enterFree();
});
window.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight'){ setAuto(false); goTo(state.index+1, true); }
  else if(e.key === 'ArrowLeft'){ setAuto(false); goTo(state.index-1, true); }
  else if(e.key === ' ' && e.target === document.body){ e.preventDefault(); setAuto(!state.auto); }
});
document.getElementById('btnAuto').classList.add('pulse');

/* ═══════════════ BUCLE DE RENDER ═══════════════ */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
const roseEl = document.getElementById('rose');
const hintEl = document.getElementById('hint');

function updateLabels(){
  const w = window.innerWidth, h = window.innerHeight;
  for(let i=0;i<labelEls.length;i++){
    const s = STOPS[labelEls[i].stop];
    tmpV.set(s.marker[0], s.marker[1], s.marker[2]).project(camera);
    const behind = tmpV.z > 1;
    labelEls[i].el.style.display = behind ? 'none' : 'block';
    if(!behind){
      labelEls[i].el.style.left = (( tmpV.x*0.5+0.5)*w).toFixed(1)+'px';
      labelEls[i].el.style.top  = ((-tmpV.y*0.5+0.5)*h).toFixed(1)+'px';
      labelEls[i].el.style.opacity = (i===state.index) ? '1' : '0.75';
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta() + 0.016, 0.05);

  // tween de cámara
  if(state.tween){
    const tw = state.tween;
    tw.t += 1/60;
    const k = easeInOutCubic(clamp(tw.t / tw.dur, 0, 1));
    camera.position.lerpVectors(tw.p0, tw.p1, k);
    state.target.lerpVectors(tw.t0, tw.t1, k);
    if(tw.t >= tw.dur){ state.tween = null; state.holdUntil = performance.now() + 6500; }
  } else if(state.mode === 'free'){
    const o = state.orbit;
    camera.position.set(
      state.target.x + o.radius * Math.sin(o.phi) * Math.sin(o.theta),
      state.target.y + o.radius * Math.cos(o.phi),
      state.target.z + o.radius * Math.sin(o.phi) * Math.cos(o.theta)
    );
  } else if(state.auto && performance.now() > state.holdUntil){
    goTo(state.index + 1, false);
  }
  camera.lookAt(state.target);

  // jets de agua
  for(let i=0;i<jets.length;i++){
    const j = jets[i];
    const s = 0.72 + 0.34 * (0.5 + 0.5*Math.sin(t*2.3 + j.phase));
    j.mesh.scale.set(1, s, 1);
    j.mesh.position.y = j.baseY + (j.h*s)/2;
    j.mesh.material.opacity = 0.6 + 0.3*Math.abs(Math.sin(t*2.3 + j.phase));
  }
  // marcadores pulsantes
  for(let i=0;i<markers.length;i++){
    const m = markers[i]; if(!m) continue;
    const s = 1 + 0.3*Math.sin(t*2.6 + i*1.3);
    m.scale.setScalar(s);
    m.rotation.y = t * 1.2;
    m.material.color.setHex(i === state.index ? 0xffe9a8 : 0xd8b36a);
  }
  // nubes a la deriva
  for(let i=0;i<clouds.length;i++){
    clouds[i].position.x += 0.02;
    if(clouds[i].position.x > 560) clouds[i].position.x = -560;
  }

  // brújula
  const dx = state.target.x - camera.position.x, dz = state.target.z - camera.position.z;
  roseEl.style.transform = 'rotate(' + (Math.atan2(-dx,-dz) * 180/Math.PI).toFixed(1) + 'deg)';

  updateLabels();
  renderer.render(scene, camera);
}

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* Inicio en la panorámica (o en ?p=N, 1-9) */
(function(){
  const p = parseInt(new URLSearchParams(location.search).get('p'), 10);
  const idx = (isFinite(p) && p >= 1 && p <= STOPS.length) ? p - 1 : 0;
  const s = STOPS[idx];
  camera.position.set(s.pos[0], s.pos[1], s.pos[2]);
  state.target.set(s.tgt[0], s.tgt[1], s.tgt[2]);
  state.index = idx;
})();
updatePanel(); updateNav();
animate();
})();
</script>
