<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#292d36;font:15px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #d79a37;outline-offset:3px}header{height:92px;border-bottom:1px solid #ccc7ba;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;background:#faf8f1}.brand{display:flex;align-items:center;gap:14px}.sigil{width:47px;height:54px;color:#9a722e}h1,h2,h3{font-family:Georgia,serif;font-weight:normal;margin:0}h1{font-size:30px;letter-spacing:-1.2px}.small,.eyebrow,.counter,.chipno{font:10px ui-monospace,Menlo,monospace;letter-spacing:1.7px;text-transform:uppercase}.small{color:#767268;margin-top:5px}.actions{display:flex;gap:10px}.plain{border:1px solid #cfcabd;background:#faf8f1;border-radius:6px;padding:9px 14px;font-size:13px;display:inline-flex;align-items:center;gap:8px}.plain:hover,.item:hover{background:#fffdf8;border-color:#a88b51}.ico{width:18px;height:18px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}main{max-width:1680px;margin:auto;padding:30px 3.3vw 18px;display:grid;grid-template-columns:280px 1fr;gap:20px}.inventory{background:#fbf9f2;border:1px solid #d0cabd;border-radius:10px;padding:25px 21px;display:flex;flex-direction:column;min-height:620px}.eyebrow{color:#927135}.inventory h2{font-size:30px;margin:8px 0 17px}.progressline{display:flex;justify-content:space-between;font-size:12px;color:#69675e}.track{height:4px;background:#e8e3d7;margin:9px 0 22px;border-radius:3px}.track i{display:block;height:100%;background:#bc9654}.search{display:flex;align-items:center;gap:8px;background:#f4f1e8;border:1px solid #d7d1c4;border-radius:5px;padding:10px;color:#898477}.search input{width:100%;min-width:0;background:none;border:0;outline:none;font-size:13px}.list{display:grid;align-content:start;gap:9px;margin:15px 0;max-height:41vh;overflow:auto;padding:2px}.item{display:flex;align-items:center;text-align:left;gap:12px;background:#fffdf7;border:1px solid #d8d1c2;box-shadow:0 2px 2px #31281c09;border-radius:6px;padding:10px 12px;min-height:55px;font:18px Georgia,serif}.emoji{font:26px system-ui}.dots{margin-left:auto;color:#aaa494;font:18px system-ui}.hint{margin-top:auto;border-top:1px solid #d9d2c3;padding-top:18px;font-size:13px;line-height:1.6;color:#6c675c}.hint b{color:#776035;display:flex;align-items:center;gap:7px;font-weight:600}.hint p{margin:6px 0 0}.board{position:relative;isolation:isolate;overflow:hidden;min-height:620px;height:calc(100svh - 184px);max-height:1000px;background:radial-gradient(ellipse at 52% 52%,#253045 0%,#1a2435 43%,#131c2b 90%);border:1px solid #262d38;border-radius:10px;color:#f8f4e6;padding:30px 32px;display:flex;flex-direction:column}.sky{position:absolute;width:100%;height:100%;inset:0;z-index:-1}.board .eyebrow{color:#d2b476}.board h2{font-size:clamp(30px,3.1vw,48px);margin:8px 0;letter-spacing:-1.3px}.board p{margin:0;color:#c2c6ce;font-size:14px}.boardhead{display:flex;justify-content:space-between;gap:10px}.clear{color:#d2d3d5;background:#ffffff06;border-color:#ffffff30;align-self:flex-start}.clear:hover{background:#ffffff16}.bench{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:300px}.orbit{position:absolute;width:min(86%,490px);height:auto;aspect-ratio:1;pointer-events:none;opacity:.62}.slots{position:relative;width:95%;max-width:640px;display:grid;grid-template-columns:1fr 30px 1fr 30px 1fr;align-items:center;justify-items:center}.slot{background:#202b3d;border:2px dashed #a9a28b88;border-radius:50%;width:clamp(84px,9vw,138px);aspect-ratio:1;display:grid;place-content:center;justify-items:center;gap:3px;font:13px Georgia,serif;color:#f0e7d6}.slot:hover,.slot.over{border-color:#e7c68a;background:#2a3548}.slot .glyph{font:35px Georgia;color:#ccbea1}.slot small{position:absolute;top:calc(100% + 15px);font:10px ui-monospace,monospace;letter-spacing:1.3px;text-transform:uppercase;color:#d1c7b1}.slot.result{border:1px solid #b99a5a;box-shadow:0 0 0 5px #1d2839,0 0 0 6px #ad915645;background:#292f39}.result .glyph{color:#e8c980}.op{color:#bba579;font:26px Georgia}.message{text-align:center;min-height:24px;font-size:14px;color:#efd29b;margin-bottom:14px}.boardfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #adb5c432;padding-top:15px;font-size:12px;color:#b9c0cb}.boardfoot button{background:none;border:0;color:#e0d0ae;font-size:13px}.footer{display:flex;justify-content:space-between;gap:12px;max-width:1680px;margin:auto;padding:0 3.5vw 16px;color:#76746b;font:11px ui-monospace,monospace}.footer a{color:inherit;text-decoration:none}dialog{background:#faf7ee;color:#272e39;border:1px solid #b7aa8e;border-radius:10px;width:min(460px,90vw);max-height:75vh;padding:25px}dialog::backdrop{background:#10182799}dialog h2{font-size:27px}dialog p,dialog li{line-height:1.65}dialog button{float:right}.empty{font-size:13px;color:#756d62}.pop{animation:pop .45s}@keyframes pop{50%{transform:scale(1.1);box-shadow:0 0 24px #dbb87d80}}@media(max-width:900px){main{grid-template-columns:225px 1fr;padding:18px 2vw;gap:12px}.board,.inventory{padding:20px 16px}.slots{width:100%;grid-template-columns:1fr 18px 1fr 18px 1fr}.clear{font-size:0;padding:8px;gap:0}}@media(max-width:680px){header{height:72px;padding:0 15px}h1{font-size:22px}.sigil{width:34px}.brand{gap:8px}.actions{gap:5px}.actions .plain{font-size:0;gap:0;padding:9px}main{display:flex;flex-direction:column;padding:12px;gap:12px}.board{order:-1;min-height:385px;height:52svh}.bench{min-height:180px}.slot{width:clamp(68px,19vw,100px)}.slot small{font-size:8px}.board p{font-size:12px}.inventory{min-height:unset}.inventory h2{font-size:25px}.list{grid-template-columns:1fr 1fr;max-height:220px}.item{font-size:15px;padding:8px;gap:6px}.footer{font-size:9px}.orbit{width:65%}.chipno{font-size:8px}.hint{margin-top:5px}}
</style>
<header><div class="brand"><svg class="sigil" viewBox="0 0 50 56" fill="none" stroke="currentColor"><ellipse cx="25" cy="29" rx="20" ry="17" transform="rotate(-32 25 29)"/><ellipse cx="25" cy="29" rx="10" ry="23" transform="rotate(33 25 29)"/><path d="m25 16 3.5 9.5L38 29l-9.5 3.5L25 42l-3.5-9.5L12 29l9.5-3.5Z" fill="#ac8446"/><circle cx="39" cy="10" r="2" fill="currentColor"/></svg><div><h1>Alquimia Reactiva</h1><div class="small">Web Reactiva</div></div></div><nav class="actions"><button class="plain" id="book" aria-label="Ver recetario"><i data-i="book"></i> Recetario</button><button class="plain" id="help" aria-label="Cómo jugar"><i data-i="help"></i> Cómo jugar</button></nav></header>
<main><aside class="inventory"><div class="eyebrow">✧ &nbsp; Colección</div><h2>Mis elementos</h2><div class="progressline"><span>Descubiertos</span><span id="count"></span></div><div class="track"><i id="bar"></i></div><label class="search"><i data-i="search"></i><input id="query" type="search" placeholder="Buscar elemento…" aria-label="Buscar elemento"></label><div class="list" id="list"></div><div class="hint"><b><i data-i="bulb"></i> Pista alquímica</b><p id="hint"></p></div></aside>

<div class="bench"><svg class="orbit" viewBox="0 0 400 400" fill="none" stroke="#ab986c" aria-hidden="true"><g opacity=".55"><circle cx="200" cy="200" r="175"/><circle cx="200" cy="200" r="169" stroke-dasharray="1 5"/><circle cx="200" cy="200" r="143"/><circle cx="200" cy="200" r="113" stroke-dasharray="3 8"/><path d="M200 25 351.55 287.5H48.45ZM200 375 48.45 112.5h303.1Z" opacity=".52"/><path d="M200 15v370M15 200h370" stroke-dasharray="2 7"/></g><g fill="#d7b978"><path d="m200 15 3 8 8 3-8 3-3 8-3-8-8-3 8-3ZM200 365l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/></g></svg><div class="slots"><button class="slot" id="a"></button><span class="op">+</span><button class="slot" id="b"></button><span class="op">=</span><button class="slot result" id="c"></button></div></div><div id="msg" class="message" role="status"></div><div class="boardfoot"><span>✧ &nbsp; <span id="mixes">0</span> mezclas</span><button id="clue">☼ &nbsp; Ver pista</button></div></section></main>
<footer class="footer"><span>✦ &nbsp; Alquimia Reactiva</span><a href="https://www.webreactiva.com/" target="_blank" rel="noopener">Universo Web Reactiva ↗</a></footer><dialog id="dialog"><button class="plain" aria-label="Cerrar" onclick="this.closest('dialog').close()">×</button><h2 id="dt"></h2><div id="detail"></div></dialog>
<script>
const $=id=>document.getElementById(id);
const icons={book:'<path d="M3 4q5-2 9 1 4-3 9-1v15q-5-2-9 1-4-3-9-1zM12 5v15"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 5 2c-2 1-2 2-2 3m0 3h.01"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',trash:'<path d="M4 6h16M9 6V3h6v3M7 6l1 14h8l1-14M10 9v8m4-8v8"/>',bulb:'<path d="M9 16c0-3-4-4-4-8a7 7 0 0 1 14 0c0 4-4 5-4 8Zm1 3h4m-3 3h2"/>'};
document.querySelectorAll('[data-i]').forEach(el=>el.outerHTML='<svg class="ico" aria-hidden="true" viewBox="0 0 24 24">'+icons[el.dataset.i]+'</svg>');
const base=['Código','Micrófono','Idea','Comunidad'];
const recipes=`Código|Idea|Proyecto|🛠️
Código|Micrófono|Podcast|🎧
Código|Comunidad|Código abierto|🔓
Micrófono|Idea|Episodio|🎙️
Micrófono|Comunidad|Entrevista|💬
Idea|Comunidad|Mastermind|🧠
Código|Código|Biblioteca|📚
Idea|Idea|Experimento|🧪
Comunidad|Comunidad|Zona Malandriner|🏕️
Micrófono|Micrófono|Estudio|🎛️
Podcast|Comunidad|Web Reactiva|⚡
Proyecto|Comunidad|Hackathon|⏱️
Episodio|Idea|Guion|📜
Código|Proyecto|Aplicación web|🌐
Aplicación web|Código|API|🔌
Aplicación web|Idea|Interfaz|🎨
Interfaz|Código|Frontend|🖥️
API|Código|Backend|⚙️
Backend|Frontend|Full stack|🧰
Proyecto|Proyecto|Portfolio|🗂️
Experimento|Código|Prototipo|🔬
Web Reactiva|Idea|Newsletter|✉️
Podcast|Zona Malandriner|Podcast premium|🎟️
Biblioteca|Código abierto|Framework|🧱
Framework|Interfaz|Componentes|🧩
Proyecto|Mastermind|Feedback|🗣️
Backend|Proyecto|Despliegue|🚀
Experimento|Idea|Inteligencia artificial|🤖
Inteligencia artificial|Guion|Prompt|⌨️
Prompt|Código|Asistente de código|🪄
Web Reactiva|Zona Malandriner|Top Malandriner|🏆
Newsletter|Comunidad|Suscriptores|📬`.split('\n').map(r=>r.split('|'));
const glyph=Object.fromEntries([...base.map((n,i)=>[n,['💻','🎤','💡','👥'][i]]),...recipes.map(r=>[r[2],r[3]])]);
const total=Object.keys(glyph).length;
let saved={};try{saved=JSON.parse(localStorage.getItem('alquimia-reactiva-v1'))||{}}catch{}
let found=new Set([...base,...(Array.isArray(saved.found)?saved.found.filter(n=>Object.hasOwn(glyph,n)):[])]),mixes=Number(saved.mixes)||0;
let pair=[null,null],result=null,finished=false,hintIndex=0;
function persist(){try{localStorage.setItem('alquimia-reactiva-v1',JSON.stringify({found:[...found],mixes}))}catch{}}
function clue(){const options=recipes.filter(([a,b,c])=>found.has(a)&&found.has(b)&&!found.has(c));$('hint').textContent=options.length?'Prueba a combinar '+options[hintIndex%options.length][0]+' con '+options[hintIndex%options.length][1]+'.':'Has completado toda la colección.'}
function inventory(){const list=$('list');list.replaceChildren();const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();for(const n of found){if(!norm(n).includes(norm($('query').value)))continue;const el=document.createElement('button');el.className='item';el.draggable=true;el.innerHTML='<span class="emoji">'+glyph[n]+'</span>'+n+'<span class="dots" aria-hidden="true">⠿</span>';el.onclick=()=>choose(n);el.ondragstart=e=>e.dataTransfer.setData('text/plain',n);list.append(el)}if(!list.children.length)list.innerHTML='<span class="empty">Sin coincidencias.</span>';$('count').textContent=found.size+' / '+total;$('bar').style.width=100*found.size/total+'%';$('mixes').textContent=mixes;clue()}
function slots(){[...pair,result].forEach((n,i)=>{const el=$(['a','b','c'][i]),label=['Elemento I','Elemento II','Resultado'][i];el.innerHTML=n?'<span class="emoji">'+glyph[n]+'</span>'+n:'<span class="glyph">'+(i===2?'✧':'+')+'</span>';el.innerHTML+='<small>'+label+'</small>';el.setAttribute('aria-label',label+', '+(n||'vacío'));el.draggable=Boolean(n)})}
function choose(n,index){if(!found.has(n))return;if(finished){pair=[null,null];result=null;finished=false}pair[index??(pair[0]?1:0)]=n;$('msg').textContent='';if(pair.every(Boolean)){mixes++;finished=true;const r=recipes.find(([x,y])=>(x===pair[0]&&y===pair[1])||(x===pair[1]&&y===pair[0]));result=r?.[2]||null;$('msg').textContent=result?(found.has(result)?'Mezcla conocida · ':'✦ Nuevo descubrimiento · ')+result:'Sin reacción. Prueba con otro elemento.';if(result)found.add(result);persist();inventory();$('c').classList.remove('pop');void $('c').offsetWidth;if(result)$('c').classList.add('pop')}slots()}
['a','b','c'].forEach((id,i)=>{const el=$(id);el.ondragstart=e=>e.dataTransfer.setData('text/plain',i===2?result:pair[i]);if(i<2){el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();el.classList.remove('over');choose(e.dataTransfer.getData('text/plain'),i)}}el.onclick=()=>{if(i===2&&result)choose(result);else if(i<2&&pair[i]){pair[i]=null;result=null;finished=false;$('msg').textContent='';slots()}else $('msg').textContent=i===2?'Combina dos elementos para obtener un resultado.':'Elige un elemento de tu colección.'}});
$('clear').onclick=()=>{pair=[null,null];result=null;finished=false;$('msg').textContent='';slots()};$('query').oninput=inventory;$('clue').onclick=()=>{hintIndex++;clue();$('msg').textContent=$('hint').textContent};
function modal(title,html){$('dt').textContent=title;$('detail').innerHTML=html;$('dialog').showModal()}
$('help').onclick=()=>modal('Cómo jugar','<p>Haz clic en dos elementos de tu colección o arrástralos a los círculos de la mesa. Puedes usar el mismo dos veces.</p><p>Cada descubrimiento se añade a tu colección. Pulsa el resultado para empezar otra mezcla con él. El recetario recoge las combinaciones que has descubierto.</p><p>Tu progreso se guarda en este navegador.</p>');
$('book').onclick=()=>{const known=recipes.filter(r=>found.has(r[2]));modal('Recetario',known.length?'<ul>'+known.map(([a,b,c])=>'<li>'+a+' + '+b+' → <b>'+c+'</b></li>').join('')+'</ul>':'<p>Tu primera mezcla abrirá el recetario. Prueba con Código e Idea.</p>')};
slots();inventory();
function sky(){const cv=document.querySelector('canvas'),w=cv.clientWidth,h=cv.clientHeight,d=Math.min(devicePixelRatio||1,2);cv.width=w*d;cv.height=h*d;const ctx=cv.getContext('2d');ctx.scale(d,d);let seed=128;const rand=()=>((seed=seed*16807%2147483647)/2147483647);for(let i=0;i<w*h/1700;i++){const x=rand()*w,y=rand()*h,r=rand();ctx.fillStyle='rgba(227,217,187,'+(.18+r*.55)+')';ctx.beginPath();ctx.arc(x,y,.35+r*.7,0,7);ctx.fill();if(r>.975){ctx.fillRect(x-3,y-.45,6,.9);ctx.fillRect(x-.45,y-3,.9,6)}}for(const points of [[[.68,.12],[.73,.18],[.81,.14],[.85,.22],[.91,.17]],[[.02,.54],[.08,.49],[.14,.56],[.11,.65],[.04,.7]],[[.71,.78],[.78,.84],[.84,.76],[.92,.79],[.97,.68]],[[.13,.89],[.2,.82],[.25,.85]]]){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h));ctx.strokeStyle='#c1b49055';ctx.stroke();for(const [x,y] of points){ctx.beginPath();ctx.arc(x*w,y*h,1.7,0,7);ctx.fillStyle='#ccbc96';ctx.fill()}}}new ResizeObserver(sky).observe(document.querySelector('.board'));
</script></html>
