services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cluster:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--port',
        '6379',
        '--cluster-enabled',
        'yes',
        '--cluster-config-file',
        '/data/nodes.conf',
        '--cluster-node-timeout',
        '5000',
        '--appendonly',
        'yes',
      ]
    ports:
      - '7000:6379'
    volumes:
      - redis-cluster-data:/data

volumes:
  redis-data:
  redis-cluster-data:
