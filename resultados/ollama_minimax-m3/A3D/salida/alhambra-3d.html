<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>La Alhambra · Ruta 3D — Granada</title>
<style>
:root{
  --gold:#d9b26a; --gold-lt:#f2dcb0; --ink:#08090b; --panel:rgba(14,16,20,.74);
  --txt:#f0e8dc; --muted:#a1978a; --line:rgba(217,178,106,.28); --accent:#79b3c8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#08090b;color:var(--txt);
  font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas#scene{position:fixed;inset:0;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.pane{pointer-events:auto;background:var(--panel);backdrop-filter:blur(14px) saturate(1.1);
  -webkit-backdrop-filter:blur(14px) saturate(1.1);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.5)}

/* ---------- cabecera ---------- */
header{position:absolute;top:16px;left:16px;padding:13px 18px 12px;max-width:min(430px,46vw)}
header h1{margin:0;font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.4px}
header h1 b{color:var(--gold);font-weight:600}
header p{margin:4px 0 0;font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}

/* ---------- lista de paradas ---------- */
#stops{position:absolute;top:16px;right:16px;width:305px;max-height:calc(100vh - 32px);
  display:flex;flex-direction:column;overflow:hidden}
#stops .ttl{padding:11px 15px;border-bottom:1px solid var(--line);font-size:10.5px;
  letter-spacing:2px;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between}
#stops ol{margin:0;padding:6px 8px 10px;overflow-y:auto;list-style:none;scrollbar-width:thin;
  scrollbar-color:rgba(217,178,106,.35) transparent}
#stops ol::-webkit-scrollbar{width:6px}
#stops ol::-webkit-scrollbar-thumb{background:rgba(217,178,106,.35);border-radius:3px}
#stops li{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:9px;cursor:pointer;
  transition:background .18s}
#stops li:hover{background:rgba(217,178,106,.09)}
#stops li .n{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:var(--gold-lt);font-variant-numeric:tabular-nums;
  background:rgba(0,0,0,.25)}
#stops li.on .n{background:var(--gold);color:#151007;border-color:var(--gold);font-weight:700}
#stops li.on{background:rgba(217,178,106,.14)}
#stops li .t{font-size:12.5px;line-height:1.35;color:#efe6d8}
#stops li.on .t{color:#fff}
#stops li .s{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}

/* ---------- ficha de la parada ---------- */
#info{position:absolute;left:16px;bottom:104px;width:min(430px,44vw);padding:15px 18px 16px;
  transition:opacity .45s,transform .45s}
#info .kicker{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold)}
#info h2{margin:5px 0 2px;font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.15}
#info .sub{font-size:11.5px;color:var(--accent);letter-spacing:.6px}
#info p{margin:9px 0 0;font-size:12.8px;line-height:1.62;color:#ded5c8}
#info .tip{margin-top:10px;font-size:11.5px;color:var(--gold-lt);border-left:2px solid var(--gold);
  padding-left:9px;line-height:1.5}
#info.swap{opacity:0;transform:translateY(8px)}

/* ---------- controles ---------- */
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:min(1000px,94vw)}
button,.btn{pointer-events:auto;background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;font-size:11.5px;letter-spacing:.6px;cursor:pointer;font-family:inherit;
  transition:background .16s,border-color .16s,color .16s;white-space:nowrap}
button:hover,.btn:hover{background:rgba(217,178,106,.18);border-color:rgba(217,178,106,.6)}
button.on{background:var(--gold);color:#150f05;border-color:var(--gold);font-weight:600}
#bar .sep{width:1px;height:22px;background:var(--line)}
#bar label{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:7px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.18);
  outline:none;cursor:pointer;width:120px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--gold);border:none;box-shadow:0 0 0 3px rgba(217,178,106,.2)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold);border:none}
#clock{font-variant-numeric:tabular-nums;font-size:12px;color:var(--gold-lt);min-width:42px;text-align:center}

/* ---------- minimapa ---------- */
#map{position:absolute;right:16px;bottom:16px;padding:10px}
#map canvas{display:block;border-radius:8px;background:rgba(0,0,0,.32)}
#map .cap{margin-top:6px;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
  display:flex;justify-content:space-between;gap:10px}

/* ---------- etiquetas 3D ---------- */
#labels{position:absolute;inset:0;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;
  font-size:11px;letter-spacing:.4px;color:#fff;text-shadow:0 2px 8px #000,0 0 2px #000;
  background:rgba(10,12,15,.5);border:1px solid rgba(217,178,106,.35);border-radius:20px;padding:3px 9px;
  backdrop-filter:blur(3px)}
.lbl.big{font-family:var(--serif);font-size:13px;letter-spacing:.5px;border-color:rgba(217,178,106,.55);
  background:rgba(10,12,15,.62)}
.lbl .idx{color:var(--gold);margin-right:5px;font-weight:700}

/* ---------- carga ---------- */
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#08090b;transition:opacity .8s}
#load .in{text-align:center;max-width:520px;padding:24px}
#load .orn{font-family:var(--serif);font-size:13px;letter-spacing:7px;color:var(--gold);text-transform:uppercase}
#load h2{font-family:var(--serif);font-size:34px;margin:12px 0 6px;font-weight:600}
#load p{color:var(--muted);font-size:12.5px;line-height:1.7;margin:6px 0 0}
#load .arc{width:200px;height:200px;margin:18px auto 6px;border:1px solid rgba(217,178,106,.35);border-radius:50%;
  position:relative;animation:spin 9s linear infinite}
#load .arc::before{content:"";position:absolute;inset:26px;border:1px solid rgba(217,178,106,.25);border-radius:50%}
#load .arc::after{content:"";position:absolute;inset:52px;border:1px solid rgba(217,178,106,.5);border-radius:50%;
  background:radial-gradient(circle,rgba(217,178,106,.35),transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
#load.gone{opacity:0;pointer-events:none}
#err{color:#e58b7a;font-size:12px;margin-top:10px}
@media (max-width:900px){
  #stops{width:250px}#info{width:min(360px,60vw);bottom:120px}
  header{max-width:60vw}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="ui">
  <div id="labels"></div>

  <header class="pane">
    <h1><b>Alhambra</b> de Granada</h1>
    <p id="sub">Ruta 3D · 15 paradas</p>
  </header>

  <section id="stops" class="pane">
    <div class="ttl"><span>Recorrido</span><span id="prog">0%</span></div>
    <ol id="list"></ol>
  </section>

  <section id="info" class="pane">
    <div class="kicker" id="i-k">Parada 1 de 14</div>
    <h2 id="i-t">—</h2>
    <div class="sub" id="i-s">—</div>
    <p id="i-p"></p>
    <div class="tip" id="i-tip"></div>
  </section>

  <div id="bar" class="pane">
    <button id="play" class="on">▶ Reproducir</button>
    <button id="restart" title="Volver al inicio">↺</button>
    <div class="sep"></div>
    <label>Velocidad <button class="btn" id="spd">1×</button></label>
    <div class="sep"></div>
    <label>Vista <button class="btn on" data-view="guia">Guía</button></label>
    <button class="btn" data-view="cine">Cinemática</button>
    <button class="btn" data-view="libre">Libre</button>
    <button class="btn" data-view="pea">Peatón</button>
    <div class="sep"></div>
    <label>☀ <input type="range" id="tod" min="5.5" max="21.5" step="0.05" value="17.6"><span id="clock">17:36</span></label>
    <div class="sep"></div>
    <button class="btn on" id="lbl">Etiquetas</button>
    <button class="btn" id="voice">Voz</button>
  </div>

  <div id="map" class="pane">
    <canvas id="mmap" width="240" height="252"></canvas>
    <div class="cap"><span>Plano</span><span>Alhambra</span></div>
  </div>
</div>

<div id="load">
  <div class="in">
    <div class="arc"></div>
    <div class="orn">Alhambra</div>
    <h2>La Alhambra de Granada</h2>
    <p>Recorrido tridimensional por la ciudadela nazarí: Alcazaba, Palacios Nazaríes,<br>Partal y Generalife.</p>
    <p id="err"></p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0 · UTILIDADES
   ============================================================ */
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const smooth= t=>t*t*(3-2*t);
const rad   = d=>d*Math.PI/180;

function mergeGeos(list){
  const gs = list.map(g=>g.index?g.toNonIndexed():g);
  const total = gs.reduce((s,g)=>s+g.attributes.position.count,0);
  const out = new THREE.BufferGeometry();
  for(const [name,size] of [['position',3],['normal',3],['uv',2]]){
    const arr = new Float32Array(total*size);
    let off=0;
    for(const g of gs){
      const a=g.attributes[name];
      if(a){ arr.set(a.array.subarray(0,a.count*size), off); }
      off += g.attributes.position.count*size;
    }
    out.setAttribute(name, new THREE.BufferAttribute(arr,size));
  }
  return out;
}

/* ============================================================
   1 · TEXTURAS PROCEDURALES
   ============================================================ */
function cvs(size,draw){
  const c=document.createElement('canvas'); c.width=c.height=size;
  draw(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=8;
  return t;
}
function rnd(seed){ let s=seed; return ()=> (s=(s*16807)%2147483647)/2147483647; }

/* azulejo: zócalo nazarí de estrella de ocho puntas */
function texAzulejo(){
  const t=cvs(512,(x,S)=>{
    x.fillStyle='#efe7d6'; x.fillRect(0,0,S,S);
    const r=rnd(7), n=8, c=S/n;
    const pal=['#1f6f8f','#2f7d4f','#b8442f','#c8a13c','#5c4b8a'];
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){
      const ox=i*c, oy=j*c, col=pal[Math.floor(r()*pal.length)];
      x.fillStyle= r()>.55?'#f6f1e4':'#e6dcc6';
      x.fillRect(ox,oy,c,c);
      x.strokeStyle=col; x.lineWidth=2.4; x.strokeRect(ox+3,oy+3,c-6,c-6);
      x.save(); x.translate(ox+c/2,oy+c/2);
      x.fillStyle=col; x.globalAlpha=.85;
      x.beginPath();
      for(let k=0;k<16;k++){
        const a=k*Math.PI/8-Math.PI/2, rad2=(k%2?c*.12:c*.31);
        k?x.lineTo(Math.cos(a)*rad2,Math.sin(a)*rad2):x.moveTo(Math.cos(a)*rad2,Math.sin(a)*rad2);
      }
      x.closePath(); x.fill();
      x.globalAlpha=1; x.fillStyle='#fff';
      x.beginPath(); x.arc(0,0,c*.07,0,7); x.fill();
      x.restore();
    }
  });
  return t;
}
/* revoco encalado */
function texStucco(base){
  return cvs(256,(x,S)=>{
    x.fillStyle=base; x.fillRect(0,0,S,S);
    const r=rnd(21);
    for(let i=0;i<5200;i++){
      const a=r()*.16; x.fillStyle=r()>.5?`rgba(255,255,255,${a})`:`rgba(90,64,36,${a})`;
      x.fillRect(r()*S,r()*S,1+r()*2,1+r()*2);
    }
    for(let i=0;i<90;i++){ x.fillStyle='rgba(120,96,64,.05)'; x.fillRect(r()*S,0,1+r()*3,S); }
  });
}
/* teja árabe */
function texRoof(){
  return cvs(256,(x,S)=>{
    x.fillStyle='#8d4b30'; x.fillRect(0,0,S,S);
    const r=rnd(3);
    for(let row=0;row<8;row++){
      const y=row*S/8;
      for(let col=-1;col<9;col++){
        const xx=col*S/8 + (row%2?S/16:0);
        x.fillStyle=`hsl(${14+r()*8},${38+r()*14}%,${28+r()*12}%)`;
        x.beginPath(); x.ellipse(xx+S/16,y+S/16,S/16,S/9,0,Math.PI,0,true); x.fill();
        x.strokeStyle='rgba(40,20,10,.45)'; x.lineWidth=1.2; x.stroke();
      }
    }
  });
}
/* empedrado */
function texPaving(){
  return cvs(256,(x,S)=>{
    x.fillStyle='#8c8172'; x.fillRect(0,0,S,S);
    const r=rnd(11);
    for(let i=0;i<900;i++){
      const px=r()*S,py=r()*S,w=7+r()*7,h=6+r()*6;
      const l=40+r()*28;
      x.fillStyle=`hsl(${34+r()*16},${8+r()*10}%,${l}%)`;
      x.beginPath(); x.ellipse(px,py,w/2,h/2,r()*3,0,7); x.fill();
    }
  });
}
/* madera del techo (taracea) */
function texWood(){
  return cvs(256,(x,S)=>{
    x.fillStyle='#4a2c18'; x.fillRect(0,0,S,S);
    const r=rnd(5);
    for(let i=0;i<420;i++){
      x.strokeStyle=`rgba(${120+r()*70|0},${70+r()*40|0},30,.35)`;
      x.lineWidth=.6+r();
      x.beginPath(); const y=r()*S; x.moveTo(0,y); x.bezierCurveTo(S*.3,y+r()*8,S*.7,y-r()*8,S,y+r()*3); x.stroke();
    }
    for(let i=0;i<12;i++){
      x.strokeStyle='rgba(210,180,120,.18)'; x.lineWidth=1.4;
      x.beginPath(); x.arc(S/2,S/2,20+i*9,0,7); x.stroke();
    }
  });
}

/* ============================================================
   2 · MATERIALES
   ============================================================ */
const T = { az:texAzulejo(), stucco:texStucco('#e7d7b4'), stuccoW:texStucco('#f2ece0'),
            roof:texRoof(), pave:texPaving(), wood:texWood() };
function rep(t,rx,ry){ const c=t.clone(); c.needsUpdate=true; c.repeat.set(rx,ry); return c; }

const M = {
  earth : new THREE.MeshStandardMaterial({color:0xb79468,roughness:.97}),
  earthD: new THREE.MeshStandardMaterial({color:0x9c7a52,roughness:.97}),
  white : new THREE.MeshStandardMaterial({color:0xf0e6d4,roughness:.9}),
  wall  : new THREE.MeshStandardMaterial({color:0xd8c5a4,roughness:.93}),
  wall2 : new THREE.MeshStandardMaterial({color:0xc0a781,roughness:.95}),
  stone : new THREE.MeshStandardMaterial({color:0x9d9382,roughness:.92}),
  stone2: new THREE.MeshStandardMaterial({color:0x776f61,roughness:.9}),
  wood  : new THREE.MeshStandardMaterial({color:0x5b3a22,roughness:.8}),
  woodD : new THREE.MeshStandardMaterial({color:0x3a2415,roughness:.85}),
  gold  : new THREE.MeshStandardMaterial({color:0xc9a227,roughness:.32,metalness:.75}),
  iron  : new THREE.MeshStandardMaterial({color:0x2e2a26,roughness:.6,metalness:.5}),
  leaf  : new THREE.MeshStandardMaterial({color:0x4e7a3a,roughness:.95}),
  leaf2 : new THREE.MeshStandardMaterial({color:0x3d6430,roughness:.95}),
  cyp   : new THREE.MeshStandardMaterial({color:0x2f4d2c,roughness:.95}),
  grass : new THREE.MeshStandardMaterial({color:0x6d7d4a,roughness:1}),
  water : new THREE.MeshStandardMaterial({color:0x2f7f9e,roughness:.06,metalness:.5,transparent:true,opacity:.82}),
  glass : new THREE.MeshStandardMaterial({color:0x8fd0e8,roughness:.05,metalness:.2,transparent:true,opacity:.4}),
};
M.roof   = new THREE.MeshStandardMaterial({map:rep(T.roof,3,3),roughness:.88});
M.roofS  = new THREE.MeshStandardMaterial({map:rep(T.roof,1,1),roughness:.88});
M.dado   = new THREE.MeshStandardMaterial({map:rep(T.az,4,1),roughness:.35});
M.dadoW  = new THREE.MeshStandardMaterial({map:rep(T.az,2,1),roughness:.35});
M.pool   = new THREE.MeshStandardMaterial({map:rep(T.az,8,1),roughness:.3});
M.pave   = new THREE.MeshStandardMaterial({map:rep(T.pave,8,8),roughness:.95});
M.pave2  = new THREE.MeshStandardMaterial({map:rep(T.pave,20,20),roughness:.95});
M.stuccoT= new THREE.MeshStandardMaterial({map:rep(T.stucco,4,4),roughness:.95});
M.stuccoW= new THREE.MeshStandardMaterial({map:rep(T.stuccoW,3,3),roughness:.93});
M.ceil   = new THREE.MeshStandardMaterial({map:rep(T.wood,3,3),roughness:.7});

/* ============================================================
   3 · PRIMITIVAS DE CONSTRUCCIÓN
   ============================================================ */
const G = new THREE.Group();                       // mundo

function box(w,h,d,mat,x=0,y=0,z=0,ry=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.rotation.y=ry; m.castShadow=true; m.receiveShadow=true; return m;
}
function cyl(rt,rb,h,seg,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
/* arco de herradura como agujero en un muro */
function archHole(cx,w,h){
  const a=w/2, R=a/Math.cos(rad(20)), yc=h-R;
  const p=new THREE.Path();
  p.moveTo(cx-a,0);
  p.lineTo(cx-a, yc-0.342*R);
  p.absarc(cx,yc,R,Math.PI+rad(20),-rad(20),true);
  p.lineTo(cx+a,0);
  p.closePath();
  return p;
}
/* muro con arcos (extrusión con huecos) */
function archWall(len,h,depth,openings,mat){
  const s=new THREE.Shape();
  s.moveTo(-len/2,0); s.lineTo(len/2,0); s.lineTo(len/2,h); s.lineTo(-len/2,h); s.closePath();
  for(const o of openings) s.holes.push(archHole(o.cx,o.w,o.h));
  const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:false,curveSegments:14});
  g.translate(0,0,-depth/2);
  const m=new THREE.Mesh(g,mat); m.castShadow=true; m.receiveShadow=true; return m;
}
/* columna esbelta con capitel y basa */
function columnGeo(h,r=0.14){
  const parts=[];
  const c=new THREE.CylinderGeometry(r*.88,r,h-0.34,10,1); c.translate(0,(h-0.34)/2+0.2,0);
  parts.push(c);
  const cap=new THREE.BoxGeometry(r*3.1,.2,r*3.1); cap.translate(0,h-.08,0); parts.push(cap);
  const bas=new THREE.BoxGeometry(r*2.9,.18,r*2.9); bas.translate(0,.09,0); parts.push(bas);
  const collar=new THREE.BoxGeometry(r*2.5,.14,r*2.5); collar.translate(0,h-.34,0); parts.push(collar);
  return mergeGeos(parts);
}
function column(h,r=0.14,mat=M.white,x=0,y=0,z=0){
  const m=new THREE.Mesh(columnGeo(h,r),mat); m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true; return m;
}
/* arquería: muro de arcos + columnas */
function arcade(len,h,bays,depth,mat=M.stuccoT,cols=true,r=0.14){
  const g=new THREE.Group(), bw=len/bays, op=[];
  for(let i=0;i<bays;i++) op.push({cx:-len/2+bw*(i+.5),w:bw*.66,h:h*.7});
  g.add(archWall(len,h,depth,op,mat));
  if(cols) for(let i=0;i<=bays;i++){
    const x=-len/2+bw*i;
    g.add(column(h*.7-.4,r,M.white,x,0,depth/2+.12));
    g.add(column(h*.7-.4,r,M.white,x,0,-depth/2-.12));
  }
  return g;
}
/* azotea con teja */
function roofBlock(w,d,h,mat=M.roof,y=0){
  const g=new THREE.Group();
  const slab=box(w+.7,.45,d+.7,M.stuccoT,0,y+.22,0); g.add(slab);
  const t=box(w,.55,d,mat,0,y+.72,0); g.add(t);
  return g;
}
/* torre rectangular */
function tower(w,d,h,mat=M.stuccoT,roof=true){

/* chimenea de tejado (torre de Comares) */

/* ============================================================
   4 · RELIEVE DEL TERRENO
   ============================================================ */
function gauss(x,z,cx,cz,sx,sz){ const dx=(x-cx)/sx,dz=(z-cz)/sz; return Math.exp(-(dx*dx+dz*dz)); }
function flatMask(x,z,x0,x1,z0,z1,m=22){
  const dx=Math.max(x0-x,0,x-x1), dz=Math.max(z0-z,0,z-z1);
  return 1-smooth(clamp(Math.hypot(dx,dz)/m,0,1));
}
function terrainH(x,z){
  let h=0;
  h += 11*gauss(x,z,-155,40,52,48);      // cerro de la Sabika (Alcazaba)
  h += 13*gauss(x,z,-140,-132,50,60);    // terraza del Generalife
  h -=  9*gauss(x,z,-40,-106,72,14);     // valle del Darro
  h +=  6*gauss(x,z,80,40,60,70);        // Silla del Moro
  h -=  1.2*gauss(x,z,-5,-15,70,60);     // leve hundimiento del palacio
  h +=  3*gauss(x,z,-70,10,40,40);
  // explanadas: explanada de los palacios + plaza, y patio de Carlos V
  h=lerp(h,0,flatMask(x,z,-74,74,-106,152,24));
  h=lerp(h,0,flatMask(x,z,-112,-52,18,86,20));
  return h;
}

/* ============================================================
   6 · CURVA DEL RECORRIDO
   ============================================================ */
function pathH(x,z){
  return terrainH(x,z)+0.35+10.2*gauss(x,z,-30,-105,22,8.5);
}
const pts = NODES.map(([x,z])=>new THREE.Vector3(x,pathH(x,z),z));
const base = new THREE.CatmullRomCurve3(pts,true,'centripetal',0.5);
const dense=[];
for(let i=0;i<900;i++){
  const q=base.getPointAt(i/900);
  dense.push(new THREE.Vector3(q.x,pathH(q.x,q.z),q.z));
}
const curve = new THREE.CatmullRomCurve3(dense,true,'centripetal',0.5);
const LEN = curve.getLength();
const SAMPLES=520;
const routePts=curve.getSpacedPoints(SAMPLES);

function distRoute(x,z){
  let best=1e9;
  for(let i=0;i<routePts.length;i+=2){
    const dx=routePts[i].x-x, dz=routePts[i].z-z;
    const d=dx*dx+dz*dz;
    if(d<best) best=d;
  }
  return Math.sqrt(best);
}

/* ============================================================
   7 · TERRENO
   ============================================================ */
function buildTerrain(){
  const SIZE=820, SEG=220;
  const geo=new THREE.PlaneGeometry(SIZE,SIZE,SEG,SEG);
  geo.rotateX(-Math.PI/2);
  const p=geo.attributes.position;
  const col=new Float32Array(p.count*3);
  const c=new THREE.Color();
  const grass=new THREE.Color(0x69794a), rock=new THREE.Color(0x8c7d63),
        sand=new THREE.Color(0xb59a72), dirt=new THREE.Color(0x94795a),
        dark=new THREE.Color(0x4a5b3c);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i), y=terrainH(x,z);
    p.setY(i,y);
    const d=distRoute(x,z);
    if(d<4.2)      c.copy(sand);
    else if(d<8)   c.copy(sand).lerp(dirt,(d-4.2)/3.8);
    else if(y>6)   c.copy(grass).lerp(rock,clamp((y-6)/9,0,1));
    else if(y<-3)  c.copy(dark).lerp(rock,clamp((-y-3)/8,0,1));
    else           c.copy(grass).lerp(dark,clamp((Math.abs(x)-20)/220,0,.55));
    const n=Math.sin(x*0.31)*Math.cos(z*0.27)*0.045;
    c.offsetHSL(n*0.4,n*0.3,n);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));
  m.receiveShadow=true;
  G.add(m);
}

function planCirc(x,z,r,c){ PLAN.push({t:'c',v:[x,z,r],c:c||'#8b8272'}); }

function hedge(x,z,w,d,h=1.1){ HEDGES.push({x,z,w,d,h}); }

/* sector de anillo (para el patio circular de Carlos V) */
function ringSector(a0,a1,rOut,rIn,h,mat){
  const s=new THREE.Shape();
  s.moveTo(Math.cos(rad(a0))*rOut, Math.sin(rad(a0))*rOut);
  s.absarc(0,0,rOut,rad(a0),rad(a1),false);
  s.lineTo(Math.cos(rad(a1))*rIn, Math.sin(rad(a1))*rIn);
  s.absarc(0,0,rIn,rad(a1),rad(a0),true);
  s.closePath();
  const geo=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false,curveSegments:44});
  geo.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(geo,mat); m.castShadow=true; m.receiveShadow=true; return m;
}

/* --- 8.3 Palacio de Carlos V --- */
function buildCarlosV(){
  const g=new THREE.Group();
  const R=24, RIN=13.5;
  // anillo con dos vanos: este (0 grados) y sur (270 grados)
  const secA=ringSector(18,252,R,RIN,7,M.stuccoT); g.add(secA);
  const secB=ringSector(288,342,R,RIN,7,M.stuccoT); g.add(secB);
  const secC=ringSector(18,252,R,RIN,7,M.stuccoW); secC.position.y=7; g.add(secC);
  const secD=ringSector(288,342,R,RIN,7,M.stuccoW); secD.position.y=7; g.add(secD);
  // columnas del patio circular
  for(let lvl=0;lvl<2;lvl++) for(let i=0;i<32;i++){
    const a=i/32*Math.PI*2, deg=a*180/Math.PI;
    if(deg<20||deg>340||(deg>70&&deg<110)) continue;      // vanos este y sur
    const c=cyl(.26,.3,6.4,12,M.stone,Math.cos(a)*(RIN-0.7),3.4+lvl*7,Math.sin(a)*(RIN-0.7));
    g.add(c);
    g.add(box(.9,.4,.9,M.stone,Math.cos(a)*(RIN-0.7),6.6+lvl*7,Math.sin(a)*(RIN-0.7)));
  }
  g.add(cyl(RIN,RIN,0.4,36,M.pave,0,0.15,0));
  // cornisa y cubierta (mismos vanos que el anillo: los pasos quedan al cielo)
  const cor1=ringSector(18,252,R+.8,RIN-.3,1.1,M.stone2); cor1.position.y=14.4; g.add(cor1);
  const cor2=ringSector(288,342,R+.8,RIN-.3,1.1,M.stone2); cor2.position.y=14.4; g.add(cor2);
  const rf1=ringSector(18,252,R+.7,RIN,.6,M.roof); rf1.position.y=15.3; g.add(rf1);
  const rf2=ringSector(288,342,R+.7,RIN,.6,M.roof); rf2.position.y=15.3; g.add(rf2);
  // portada sur
  const por=arcade(14,7,4,3,M.stuccoW,true,0.3); por.position.set(0,0,R+1.4); g.add(por);
  g.add(box(16,1,4,M.dadoW,0,6.6,R+1.4));
  // pórtico este (vano abierto al cielo)
  for(let i=0;i<6;i++){
    const a=rad(-30+i*12), r=RIN+3.2;
    g.add(cyl(.26,.3,13,12,M.stone,Math.cos(a)*r,6.5,Math.sin(a)*r));
  }
  g.position.set(-80,0,50); G.add(g);
  planRect(-104,-56,26,74,'#9c9280');
}

/* ============================================================
   9 · VEGETACIÓN (instanciada)
   ============================================================ */
function buildVegetation(){
  const trunkG=new THREE.CylinderGeometry(0.22,0.34,3,6); trunkG.translate(0,1.5,0);
  const leavesG=new THREE.SphereGeometry(1.9,10,8); leavesG.translate(0,4.2,0);
  const bark=new THREE.MeshStandardMaterial({color:0x5a4432,roughness:.95});
  const leafM=new THREE.MeshStandardMaterial({color:0x4f7b38,roughness:.95,flatShading:true});
  if(TREES.length){
    const ti=new THREE.InstancedMesh(trunkG,bark,TREES.length);
    const li=new THREE.InstancedMesh(leavesG,leafM,TREES.length);
    const m=new THREE.Matrix4();
    TREES.forEach((t,i)=>{
      const y=terrainH(t.x,t.z);
      m.makeScale(t.s,t.s,t.s); m.setPosition(t.x,y,t.z); ti.setMatrixAt(i,m);
      m.makeScale(t.s*1.05,t.s*.9,t.s*1.05); m.setPosition(t.x,y,t.z); li.setMatrixAt(i,m);
    });
    ti.castShadow=li.castShadow=true; ti.receiveShadow=li.receiveShadow=true;
    G.add(ti); G.add(li);
  }
  if(CYPS.length){
    const cg=new THREE.ConeGeometry(1.15,8,9); cg.translate(0,4,0);
    const ci=new THREE.InstancedMesh(cg,M.cyp,CYPS.length);
    const m=new THREE.Matrix4();
    CYPS.forEach((t,i)=>{
      const y=terrainH(t.x,t.z);
      m.makeScale(t.s,t.s,t.s); m.setPosition(t.x,y,t.z); ci.setMatrixAt(i,m);
    });
    ci.castShadow=true; G.add(ci);
  }
  if(HEDGES.length){
    const hg=new THREE.BoxGeometry(1,1,1);
    const hi=new THREE.InstancedMesh(hg,M.leaf2,HEDGES.length);
    const m=new THREE.Matrix4();
    HEDGES.forEach((t,i)=>{
      const y=terrainH(t.x,t.z);
      m.makeScale(t.w,t.h,t.d); m.setPosition(t.x,y+t.h/2,t.z); hi.setMatrixAt(i,m);
    });
    hi.castShadow=true; hi.receiveShadow=true; G.add(hi);
  }
}

};

  fragmentShader:`uniform vec3 top,bot,sun,sunCol; uniform float off,ex; varying vec3 vW;

      c+=sunCol*pow(s,10.)*.55 + sunCol*pow(s,220.)*1.6;

function dashTexture(){
  const c=document.createElement('canvas'); c.width=64; c.height=4;
  const x=c.getContext('2d');
  x.clearRect(0,0,64,4);
  const g=x.createLinearGradient(0,0,40,0);
  g.addColorStop(0,'rgba(255,235,190,1)');
  g.addColorStop(.7,'rgba(255,200,110,1)');
  g.addColorStop(1,'rgba(255,200,110,0)');
  x.fillStyle=g; x.fillRect(0,0,40,4);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(140,1); return t;
}

function numberTexture(n){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  x.clearRect(0,0,128,128);
  x.beginPath(); x.arc(64,64,52,0,7);
  x.fillStyle='rgba(12,14,18,.82)'; x.fill();
  x.lineWidth=5; x.strokeStyle='#d9b26a'; x.stroke();
  x.fillStyle='#f6e2b4'; x.font='bold 58px Georgia, serif';
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText(String(n),64,68);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const stopU=[];
STOPS.forEach((s,i)=>{
  const p=new THREE.Vector3(s.p[0],pathH(s.p[0],s.p[1]),s.p[1]);
  const grp=new THREE.Group();
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:numberTexture(i+1),depthTest:true}));
  spr.scale.set(4.6,4.6,1); spr.position.y=5.2; grp.add(spr);
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.7,.35,16),
    new THREE.MeshStandardMaterial({color:0x2a2f36,roughness:.8,emissive:0x6a4a18,emissiveIntensity:.4}));
  ped.position.y=.15; ped.receiveShadow=true; grp.add(ped);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.9,.07,6,28),
    new THREE.MeshBasicMaterial({color:0xd9b26a,transparent:true,opacity:.6}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.4; grp.add(ring);
  grp.position.copy(p);
  scene.add(grp);
  stopU.push({u:closestU(p),p,grp,spr});
});
function closestU(p){
  let best=1e9,bu=0;
  for(let i=0;i<1200;i++){
    const q=curve.getPointAt(i/1200);
    const d=q.distanceToSquared(p);
    if(d<best){best=d;bu=i/1200;}
  }
  return bu;
}

/* ============================================================
   14 · SOL Y HORA DEL DÍA
   ============================================================ */
const LAMPS=[];
scene.traverse(o=>{ if(o.material&&o.material.emissive&&o.material.emissiveIntensity>0.4&&o.material.emissive.getHex()===0xffcc66) LAMPS.push(o.material); });
const cTop=new THREE.Color(), cBot=new THREE.Color(), cTmp=new THREE.Color();
const SUN_TGT=new THREE.Vector3(-45,0,-30);
const V_UP=new THREE.Vector3(0,1,0), V_LVL=new THREE.Vector3(0,2,0);
const progEl=document.getElementById('prog');
const PAL=[
 [0.0,0x070c1a,0x0d1626],[0.12,0x2a3f6b,0xe08a4e],[0.26,0x4b86c4,0xd7e6ee],
 [0.62,0x4b86c4,0xd7e6ee],[0.76,0x2f3f6d,0xef9450],[0.88,0x141c33,0x2b3550],[1.0,0x070c1a,0x0d1626]
];
function skyPal(t){
  for(let i=0;i<PAL.length-1;i++){
    if(t>=PAL[i][0]&&t<=PAL[i+1][0]){
      const f=(t-PAL[i][0])/(PAL[i+1][0]-PAL[i][0]||1);
      cTop.setHex(PAL[i][1]).lerp(cTmp.setHex(PAL[i+1][1]),f);
      cBot.setHex(PAL[i][2]).lerp(cTmp.setHex(PAL[i+1][2]),f);
      return;
    }
  }
}
function updateSun(h){
  const dayT=clamp((h-6)/14,0,1);
  const az=Math.PI*dayT, el=Math.sin(dayT*Math.PI)*1.12;
  const dir=new THREE.Vector3(Math.cos(az)*Math.cos(el),Math.sin(el),0.45*Math.sin(el)+0.22).normalize();
  const dayF=clamp(Math.sin(el)*3.4,0,1);
  sun.position.copy(dir).multiplyScalar(340).add(SUN_TGT);
  sun.target.position.copy(SUN_TGT);
  sun.intensity=0.25+3.3*dayF;
  sun.color.setHex(0xff9c4e).lerp(cTmp.setHex(0xfff4e2),clamp(el/0.9,0,1));
  skyPal(clamp((h-6)/14,0,1));
  skyU.top.value.copy(cTop); skyU.bot.value.copy(cBot);
  skyU.sun.value.copy(dir); skyU.sunCol.value.copy(sun.color);
  hemi.intensity=0.28+0.85*dayF;
  hemi.color.copy(cTop).lerp(cTmp.setHex(0xffffff),.35);
  hemi.groundColor.setHex(0x3a3226).lerp(cTmp.setHex(0x6b5a44),dayF);
  amb.intensity=0.1+0.14*dayF;
  starMat.opacity=clamp(0.85-dayF*1.6,0,0.85);
  scene.fog.color.copy(cBot);
  scene.fog.density=0.0016+ (1-dayF)*0.0008;
  renderer.toneMappingExposure=0.95+0.22*dayF;
  LAMPS.forEach(m=>{ m.emissiveIntensity=0.35+1.5*(1-dayF); });
}

/* ============================================================
   15 · MINIMAPA
   ============================================================ */
const mm=document.getElementById('mmap'), mx=mm.getContext('2d');
const MB={x0:-196,x1:106,z0:-186,z1:158};
const MS=Math.min(mm.width/(MB.x1-MB.x0),mm.height/(MB.z1-MB.z0));
const MOX=(mm.width-(MB.x1-MB.x0)*MS)/2, MOZ=(mm.height-(MB.z1-MB.z0)*MS)/2;
const mX=x=>MOX+(x-MB.x0)*MS, mZ=z=>MOZ+(MB.z1-z)*MS;
function drawMap(){
  mx.clearRect(0,0,mm.width,mm.height);
  // río
  mx.strokeStyle='rgba(80,150,190,.55)'; mx.lineWidth=2;
  mx.beginPath();
  for(let x=-230;x<=140;x+=8){
    const z=-104-3*Math.sin(x*.008);
    x===-230?mx.moveTo(mX(x),mZ(z)):mx.lineTo(mX(x),mZ(z));
  }
  mx.stroke();
  // masas de edificio
  PLAN.forEach(p=>{
    mx.fillStyle='rgba(146,136,116,.30)'; mx.strokeStyle='rgba(196,184,160,.45)'; mx.lineWidth=.7;
    mx.beginPath();
    if(p.t==='r') mx.rect(mX(p.v[0]),mZ(p.v[3]),(p.v[1]-p.v[0])*MS,(p.v[3]-p.v[2])*MS);
    else mx.arc(mX(p.v[0]),mZ(p.v[1]),p.v[2]*MS,0,7);
    mx.fill(); mx.stroke();
  });
  // trazado (con borde oscuro para que destaque)
  mx.lineJoin='round'; mx.lineCap='round';
  mx.strokeStyle='rgba(0,0,0,.55)'; mx.lineWidth=4; mx.setLineDash([]);
  mx.beginPath();
  routePts.forEach((p,i)=> i?mx.lineTo(mX(p.x),mZ(p.z)):mx.moveTo(mX(p.x),mZ(p.z)));
  mx.stroke();
  mx.strokeStyle='#ffc978'; mx.lineWidth=1.8; mx.setLineDash([5,3]);
  mx.beginPath();
  routePts.forEach((p,i)=> i?mx.lineTo(mX(p.x),mZ(p.z)):mx.moveTo(mX(p.x),mZ(p.z)));
  mx.stroke(); mx.setLineDash([]);
  // paradas
  stopU.forEach((s,i)=>{
    mx.fillStyle=(i===current)?'#f5d79a':'rgba(217,178,106,.85)';
    mx.beginPath(); mx.arc(mX(s.p.x),mZ(s.p.z),(i===current)?4.6:3,0,7); mx.fill();
    mx.fillStyle='#101214'; mx.font='bold 7px sans-serif'; mx.textAlign='center'; mx.textBaseline='middle';
    mx.fillText(String(i+1),mX(s.p.x),mZ(s.p.z)+.4);
  });
  // viajero
  const p=curPos;
  mx.save();
  mx.translate(mX(p.x),mZ(p.z));
  mx.rotate(Math.atan2(dir3.x,dir3.z));
  mx.fillStyle='#fff'; mx.beginPath();
  mx.moveTo(0,-6); mx.lineTo(4,4); mx.lineTo(0,1.5); mx.lineTo(-4,4); mx.closePath(); mx.fill();
  mx.restore();
  // norte
  mx.fillStyle='rgba(255,255,255,.55)'; mx.font='9px sans-serif'; mx.textAlign='center';
  mx.fillText('N',mm.width-12,14);
  mx.strokeStyle='rgba(255,255,255,.5)'; mx.beginPath();
  mx.moveTo(mm.width-12,18); mx.lineTo(mm.width-12,30); mx.stroke();
  mx.beginPath(); mx.moveTo(mm.width-12,16); mx.lineTo(mm.width-15,22); mx.lineTo(mm.width-9,22); mx.closePath();
  mx.fillStyle='rgba(255,255,255,.6)'; mx.fill();
}

/* ============================================================
   16 · BUCLE DE ANIMACIÓN
   ============================================================ */
let u=0, lastU=0, lastT=performance.now(), curStop=-1, lastPr=-1;
const curPos=new THREE.Vector3(), dir3=new THREE.Vector3(), tmpV=new THREE.Vector3();
const tmpA=new THREE.Vector3(), tmpB=new THREE.Vector3(), tmpC=new THREE.Vector3(), tmpD=new THREE.Vector3();
const TOUR=175;

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(Math.max((now-lastT)/1000,0),.05); lastT=now;

  // avance del recorrido
  if(tween){
    tween.t+=dt;
    const k=clamp(tween.t/tween.dur,0,1);
    let d=tween.to-tween.from;
    if(d>0.5) d-=1; if(d<-0.5) d+=1;
    u=((tween.from+d*smooth(k))%1+1)%1;
    if(k>=1){ tween=null; lastU=u; }
  } else if(playing){
    u=((u+dt*spd/TOUR)%1+1)%1;
  }
  lastU=u;

  // posición y dirección
  curve.getPointAt(u,curPos);
  curve.getTangentAt(u,dir3); dir3.y=0; dir3.normalize();
  traveler.position.copy(curPos);
  halo.rotation.z+=dt*1.2;
  orb.scale.setScalar(1+Math.sin(now*0.004)*0.07);

  // detección de paradas
  let best=-1,bd=1e9;
  stopU.forEach((s,i)=>{
    let d=Math.abs(s.u-u); if(d>0.5) d=1-d;
    if(d<bd){bd=d;best=i;}
  });
  if(best>=0&&bd<0.0045&&best!==curStop){ curStop=best; showStop(best); }

  // cámara
  const fwd=tmpA.copy(dir3);
  const side=tmpB.set(-fwd.z,0,fwd.x);
  const want=tmpC, look=tmpD;
  if(view==='guia'){
    want.copy(curPos).addScaledVector(fwd,-17).setY(curPos.y+8.5);
    look.copy(curPos).addScaledVector(fwd,7).setY(curPos.y+2);
  } else if(view==='cine'){
    want.copy(curPos).addScaledVector(side,30).addScaledVector(fwd,-12).setY(curPos.y+17);
    look.copy(curPos).addScaledVector(fwd,9).setY(curPos.y+1);
  } else if(view==='pea'){
    want.copy(curPos).setY(curPos.y+1.75);
    look.copy(curPos).addScaledVector(fwd,12).setY(curPos.y+1.75);
  }
  if(view!=='libre'){
    const k=1-Math.pow(0.0015,dt);
    camera.position.lerp(want,k);
    tmpV.copy(look); camera.lookAt(tmpV);
  } else {
    controls.update();
  }

  // tubería animada
  dash.offset.x=(-now*0.00009)%1;
  glowMat.opacity=0.10+0.05*Math.sin(now*0.002);

  // etiquetas
  if(labelsOn){
    for(const L of LABELS){
      tmpV.copy(L.p).project(camera);
      if(tmpV.z>1||tmpV.z<-1||Math.abs(tmpV.x)>1.2||Math.abs(tmpV.y)>1.2){ L.el.style.display='none'; continue; }
      L.el.style.display='block';
      L.el.style.left=((tmpV.x*0.5+0.5)*innerWidth)+'px';
      L.el.style.top=((-tmpV.y*0.5+0.5)*innerHeight)+'px';
      L.el.style.opacity=String(clamp(1.6-Math.abs(tmpV.z)*1.2,.25,1));
    }
  }

  updateSun(tod);
  drawMap();

  // progreso
  const pr=Math.round(u*100);
  if(pr!==lastPr){ lastPr=pr; progEl.textContent=pr+'%'; }

  renderer.render(scene,camera);
}
